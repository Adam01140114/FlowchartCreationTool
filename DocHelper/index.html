<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DocHelper</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="dochelper.css">
</head>
<body>
  <header class="top">
    <div class="top-inner">
      <a class="brand" href="./index.html" aria-label="DocHelper, start over">
        <span class="mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="m9 15 2 2 4-4"/></svg>
        </span>
        <span class="brand-name">DocHelper</span>
      </a>
      <div class="top-actions">
        <span class="mode-pill" id="modePill" hidden></span>
        <button class="ghost" id="startOver" type="button" hidden>Start over</button>
      </div>
    </div>
    <div class="progress" id="progressBar" hidden><span></span></div>
  </header>

  <main class="chat" id="chat" aria-live="polite"></main>

  <footer class="composer" id="composer"></footer>

  <input type="file" id="responseInput" accept=".zip,.json,application/zip,application/json" hidden>

  <script src="interview-walk.js"></script>
  <script src="dochelper.js"></script>
</body>
</html>
