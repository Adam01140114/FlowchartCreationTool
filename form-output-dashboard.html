<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Current Form Output</title>
<style>
  :root {
    --ink: #16191d;
    --muted: #6b7785;
    --line: #e4e8ee;
    --paper: #ffffff;
    --ground: #f4f6f9;
    --accent: #2f6fed;
    --ok: #17845a;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ink: #e8ecf1; --muted: #98a3b3; --line: #2a3038;
      --paper: #1b1f25; --ground: #111418; --accent: #6f9dff; --ok: #46c391;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--ground); color: var(--ink);
    font: 15px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  header {
    position: sticky; top: 0; z-index: 20;
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
    padding: 14px 24px; background: var(--paper);
    border-bottom: 1px solid var(--line);
  }
  h1 { margin: 0; font-size: 17px; font-weight: 650; letter-spacing: -0.01em; }
  .stamp { color: var(--muted); font-size: 13px; }
  .dot {
    display: inline-block; width: 7px; height: 7px; border-radius: 50%;
    background: var(--ok); margin-right: 6px; vertical-align: 1px;
  }
  .dot.stale { background: #d08a1a; }
  .dot.gone { background: #d0453f; }
  nav { display: flex; gap: 6px; margin-left: auto; flex-wrap: wrap; }
  nav a {
    text-decoration: none; color: var(--muted); font-size: 13px; font-weight: 600;
    padding: 5px 11px; border-radius: 999px; border: 1px solid var(--line);
  }
  nav a:hover { color: var(--accent); border-color: var(--accent); }
  main { padding: 24px; max-width: 1600px; margin: 0 auto; }
  section { margin-bottom: 40px; scroll-margin-top: 80px; }
  .form-head {
    display: flex; align-items: baseline; gap: 10px;
    margin: 0 0 12px; padding-bottom: 8px; border-bottom: 1px solid var(--line);
  }
  .form-head h2 { margin: 0; font-size: 15px; font-weight: 650; letter-spacing: 0.02em; }
  .form-head .count { color: var(--muted); font-size: 13px; }
  .pages {
    display: grid; gap: 18px;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  }
  figure {
    margin: 0; background: var(--paper); border: 1px solid var(--line);
    border-radius: 10px; overflow: hidden;
    box-shadow: 0 1px 2px rgba(16, 22, 30, 0.05);
    transition: box-shadow .15s ease, transform .15s ease;
  }
  figure:hover { box-shadow: 0 6px 18px rgba(16, 22, 30, 0.12); transform: translateY(-2px); }
  figure img { display: block; width: 100%; height: auto; background: #fff; cursor: zoom-in; }
  figcaption {
    padding: 7px 10px; font-size: 12px; color: var(--muted);
    border-top: 1px solid var(--line); display: flex; justify-content: space-between;
  }
  .empty { color: var(--muted); padding: 40px 0; text-align: center; }
  dialog {
    border: none; border-radius: 12px; padding: 0; max-width: 96vw; max-height: 96vh;
    background: var(--paper);
  }
  dialog::backdrop { background: rgba(10, 13, 18, .72); }
  dialog img { display: block; max-width: 96vw; max-height: 90vh; width: auto; }
  dialog .bar {
    display: flex; justify-content: space-between; align-items: center;
    padding: 8px 14px; font-size: 13px; color: var(--muted); border-top: 1px solid var(--line);
  }
  dialog button {
    border: 1px solid var(--line); background: transparent; color: var(--ink);
    border-radius: 6px; padding: 4px 12px; cursor: pointer; font: inherit; font-size: 13px;
  }
</style>
</head>
<body>
<header>
  <h1>Current Form Output</h1>
  <span class="stamp" id="stamp"><span class="dot" id="dot"></span>loading…</span>
  <nav id="nav"></nav>
</header>

<main id="main">
  <p class="empty">Reading <code>Current Form Output/</code>…</p>
</main>

<dialog id="viewer">
  <img id="viewerImg" alt="">
  <div class="bar"><span id="viewerLabel"></span><button id="viewerClose">Close</button></div>
</dialog>

<script>
/*
 * A window onto the folder the audit publishes, refreshed every three seconds.
 *
 * The images are files on disk that a pipeline run replaces, so the page cannot
 * be told when they change - it asks. Two things are polled and they are not
 * the same question: the manifest says which forms and how many pages exist,
 * and each image carries a cache-busting stamp so the browser fetches the new
 * bytes rather than showing the ones it already has.
 *
 * The layout is only rebuilt when the shape changes - a form added, a page
 * count different. Rebuilding every three seconds would throw away the scroll
 * position and flash every image, which is exactly what you do not want while
 * you are reading one.
 */
const ROOT = 'Current Form Output';
const EVERY_MS = 3000;

let shape = '';
let missCount = 0;

const el = (tag, attrs, kids) => {
  const node = document.createElement(tag);
  Object.entries(attrs || {}).forEach(([k, v]) => {
    if (k === 'class') node.className = v; else node.setAttribute(k, v);
  });
  (kids || []).forEach((k) => node.appendChild(k));
  return node;
};
const text = (s) => document.createTextNode(s);
const pad = (n) => String(n).padStart(2, '0');
const src = (form, n, stamp) =>
  ROOT + '/' + form + '/page-' + pad(n) + '.png?v=' + encodeURIComponent(stamp);

function build(manifest) {
  const main = document.getElementById('main');
  const nav = document.getElementById('nav');
  main.textContent = '';
  nav.textContent = '';

  if (!manifest.forms.length) {
    main.appendChild(el('p', { class: 'empty' }, [text('Nothing published yet.')]));
    return;
  }

  manifest.forms.forEach((form) => {
    nav.appendChild(el('a', { href: '#' + form.name }, [text(form.name)]));

    const grid = el('div', { class: 'pages' });
    for (let n = 1; n <= form.pages; n++) {
      const img = el('img', {
        src: src(form.name, n, manifest.publishedAt),
        alt: form.name + ' page ' + n, loading: 'lazy',
        'data-form': form.name, 'data-page': String(n)
      });
      img.addEventListener('click', () => open(img));
      grid.appendChild(el('figure', {}, [
        img,
        el('figcaption', {}, [
          text('Page ' + n),
          el('span', {}, [text(form.name)])
        ])
      ]));
    }

    main.appendChild(el('section', { id: form.name }, [
      el('div', { class: 'form-head' }, [
        el('h2', {}, [text(form.name)]),
        el('span', { class: 'count' }, [text(form.pages + ' page' + (form.pages === 1 ? '' : 's'))])
      ]),
      grid
    ]));
  });
}

/** Same pictures, newer bytes: swap the stamp without touching the layout. */
function refreshImages(stamp) {
  document.querySelectorAll('#main img').forEach((img) => {
    const next = src(img.dataset.form, Number(img.dataset.page), stamp);
    if (img.getAttribute('src') !== next) img.setAttribute('src', next);
  });
}

function setStatus(state, label) {
  document.getElementById('dot').className = 'dot' + (state ? ' ' + state : '');
  document.getElementById('stamp').lastChild.nodeValue = label;
}

async function poll() {
  try {
    const res = await fetch(ROOT + '/manifest.json?t=' + Date.now(), { cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const manifest = await res.json();
    missCount = 0;

    const next = JSON.stringify(manifest.forms);
    if (next !== shape) { shape = next; build(manifest); }
    else refreshImages(manifest.publishedAt);

    const when = new Date(manifest.publishedAt);
    const age = Math.round((Date.now() - when.getTime()) / 1000);
    setStatus(age > 3600 ? 'stale' : '',
      'published ' + when.toLocaleTimeString() + ' · ' + describeAge(age));
  } catch (err) {
    missCount++;
    if (missCount > 1) {
      setStatus('gone', 'no manifest — run: node pipeline-current-output.js');
    }
  }
}

function describeAge(seconds) {
  if (seconds < 90) return 'just now';
  if (seconds < 5400) return Math.round(seconds / 60) + ' min ago';
  return Math.round(seconds / 3600) + ' h ago';
}

/* the lightbox */
const viewer = document.getElementById('viewer');
function open(img) {
  document.getElementById('viewerImg').src = img.getAttribute('src');
  document.getElementById('viewerLabel').textContent =
    img.dataset.form + ' — page ' + img.dataset.page;
  viewer.showModal();
}
document.getElementById('viewerClose').addEventListener('click', () => viewer.close());
viewer.addEventListener('click', (e) => { if (e.target === viewer) viewer.close(); });

poll();
setInterval(poll, EVERY_MS);
</script>
</body>
</html>
