<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Current Form Output</title>
<style>
  :root {
    --ink: #16191d;
    --muted: #6b7785;
    --line: #e4e8ee;
    --paper: #ffffff;
    --ground: #f4f6f9;
    --accent: #2f6fed;
    --ok: #17845a;
    --link: #7a4fd6;
    --link-wash: rgba(122, 79, 214, .06);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ink: #e8ecf1; --muted: #98a3b3; --line: #2a3038;
      --paper: #1b1f25; --ground: #111418; --accent: #6f9dff; --ok: #46c391;
      --link: #b18aff; --link-wash: rgba(177, 138, 255, .09);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--ground); color: var(--ink);
    font: 15px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  header {
    position: sticky; top: 0; z-index: 20;
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
    padding: 14px 24px; background: var(--paper);
    border-bottom: 1px solid var(--line);
  }
  h1 { margin: 0; font-size: 17px; font-weight: 650; letter-spacing: -0.01em; }
  .sub-project {
    font: 11.5px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 2px 9px;
  }
  .stamp { color: var(--muted); font-size: 13px; }
  .dot {
    display: inline-block; width: 7px; height: 7px; border-radius: 50%;
    background: var(--ok); margin-right: 6px; vertical-align: 1px;
  }
  .dot.stale { background: #d08a1a; }
  .dot.gone { background: #d0453f; }
  nav { display: flex; gap: 6px; margin-left: auto; flex-wrap: wrap; }
  nav a {
    text-decoration: none; color: var(--muted); font-size: 13px; font-weight: 600;
    padding: 5px 11px; border-radius: 999px; border: 1px solid var(--line);
  }
  nav a:hover { color: var(--accent); border-color: var(--accent); }
  .btn-rules {
    text-decoration: none; font-size: 13px; font-weight: 600;
    background: var(--accent); color: #fff; border: 1px solid var(--accent);
    border-radius: 8px; padding: 6px 13px; white-space: nowrap;
  }
  .btn-rules:hover { filter: brightness(1.08); }
  main { padding: 24px; max-width: 1600px; margin: 0 auto; }
  section { margin-bottom: 40px; scroll-margin-top: 80px; }
  .form-head {
    display: flex; align-items: baseline; gap: 10px;
    margin: 0 0 12px; padding-bottom: 8px; border-bottom: 1px solid var(--line);
  }
  .form-head h2 { margin: 0; font-size: 15px; font-weight: 650; letter-spacing: 0.02em; }
  .form-head .count { color: var(--muted); font-size: 13px; }
  .pages {
    display: grid; gap: 18px;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  }
  figure {
    margin: 0; background: var(--paper); border: 1px solid var(--line);
    border-radius: 10px; overflow: hidden;
    box-shadow: 0 1px 2px rgba(16, 22, 30, 0.05);
    transition: box-shadow .15s ease, transform .15s ease;
  }
  figure:hover { box-shadow: 0 6px 18px rgba(16, 22, 30, 0.12); transform: translateY(-2px); }
  figure img { display: block; width: 100%; height: auto; background: #fff; cursor: zoom-in; }
  figcaption {
    padding: 7px 10px; font-size: 12px; color: var(--muted);
    border-top: 1px solid var(--line); display: flex; justify-content: space-between;
  }
  details.data { margin-top: 14px; }
  details.data > summary {
    cursor: pointer; font-size: 13px; font-weight: 650; color: var(--muted);
    padding: 7px 11px; border: 1px solid var(--line); border-radius: 8px;
    background: var(--paper); list-style: none; display: flex; gap: 10px; align-items: center;
  }
  details.data > summary::-webkit-details-marker { display: none; }
  details.data > summary::before { content: "\25B8"; font-size: 11px; }
  details.data[open] > summary::before { content: "\25BE"; }
  details.data > summary:hover { color: var(--accent); border-color: var(--accent); }
  .pill {
    font-size: 11px; font-weight: 700; border-radius: 999px; padding: 1px 8px;
    border: 1px solid var(--line); color: var(--muted);
  }
  .panes { display: grid; gap: 14px; margin-top: 12px; grid-template-columns: repeat(auto-fit, minmax(330px, 1fr)); }
  .pane { background: var(--paper); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  .pane h3 {
    margin: 0; padding: 9px 12px; font-size: 12px; font-weight: 700; letter-spacing: .04em;
    text-transform: uppercase; color: var(--muted); border-bottom: 1px solid var(--line);
    display: flex; justify-content: space-between; align-items: center;
  }
  .rows { max-height: 340px; overflow: auto; }
  .row {
    display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 10px;
    padding: 5px 12px; border-bottom: 1px solid var(--line); align-items: baseline;
  }
  .row:last-child { border-bottom: none; }
  .row .k {
    font: 11.5px/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    color: var(--muted); overflow-wrap: anywhere;
  }
  .row .v { font-size: 12.5px; overflow-wrap: anywhere; }
  .row.blank .v { color: var(--muted); font-style: italic; }
  .row .v.on { color: var(--ok); font-weight: 650; }
  .row .v.off { color: var(--muted); }
  .filter {
    font: inherit; font-size: 12px; padding: 3px 8px; border-radius: 6px; width: 130px;
    border: 1px solid var(--line); background: var(--ground); color: var(--ink);
  }
  figure > details.page { border-top: 1px solid var(--line); }
  figure > details.page > summary {
    cursor: pointer; padding: 6px 10px; font-size: 11.5px; color: var(--muted);
    list-style: none; display: flex; justify-content: space-between; gap: 8px;
  }
  figure > details.page > summary::-webkit-details-marker { display: none; }
  figure > details.page > summary:hover { color: var(--accent); }
  figure > details.page .rows { max-height: 260px; border-top: 1px solid var(--line); }
  figcaption .copy-page {
    border: 1px solid var(--line); background: transparent; color: var(--muted);
    border-radius: 6px; font: inherit; font-size: 11px; padding: 1px 7px; cursor: pointer;
  }
  figcaption .copy-page:hover { color: var(--accent); border-color: var(--accent); }
  figcaption .copy-page.done { color: var(--ok); border-color: var(--ok); }
  .row .why {
    grid-column: 1 / -1; font-size: 11.5px; color: var(--muted);
    padding-left: 2px; margin-top: 1px;
  }
  .row.unexplained { background: rgba(192, 83, 47, .07); }
  .row.unexplained .k { color: #c0532f; font-weight: 650; }
  .ok { color: var(--ok); font-weight: 650; }
  figure.linked { border-color: var(--link); box-shadow: 0 0 0 1px var(--link) inset; }
  .link-bar {
    display: flex; gap: 6px; align-items: baseline; flex-wrap: wrap;
    padding: 6px 10px; font-size: 11.5px; color: var(--link);
    border-top: 1px dashed var(--link); background: var(--link-wash);
  }
  .link-bar b { font-weight: 700; }
  .link-bar .to { color: var(--muted); }
  .row .shared {
    grid-column: 1 / -1; font-size: 11.5px; color: var(--link); padding-left: 2px;
  }
  .row .shared.caption { color: var(--muted); }
  .connector-bar {
    display: flex; gap: 8px; flex-wrap: wrap; align-items: baseline;
    padding: 5px 10px 7px; font-size: 11.5px; color: var(--link);
    background: var(--link-wash);
  }
  .connector-bar b { font-weight: 700; }
  .connector-bar .off { color: var(--muted); }
  .miss { color: #c0532f; font-weight: 650; }
  @media (prefers-color-scheme: dark) { .miss { color: #f08a63; } }
  .project-pick {
    font: inherit; font-size: 12.5px; padding: 5px 9px; border-radius: 8px;
    border: 1px solid var(--line); background: var(--ground); color: var(--ink);
  }
  .nothing { max-width: 640px; margin: 40px auto; }
  .nothing h2 { margin: 0 0 10px; font-size: 17px; font-weight: 650; }
  .nothing p { margin: 0 0 10px; color: var(--muted); }
  .nothing code {
    font: 12.5px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    background: var(--paper); border: 1px solid var(--line); border-radius: 4px; padding: 1px 5px;
  }
  .nothing pre {
    background: var(--paper); border: 1px solid var(--line); border-radius: 9px;
    padding: 12px 14px; overflow-x: auto; margin: 0 0 18px;
    font: 12.5px/1.6 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  .others { display: grid; gap: 8px; margin-bottom: 14px; }
  .others a {
    display: flex; justify-content: space-between; gap: 12px; text-decoration: none;
    background: var(--paper); border: 1px solid var(--line); border-radius: 9px;
    padding: 10px 13px; color: var(--ink);
  }
  .others a:hover { border-color: var(--accent); color: var(--accent); }
  .others span { color: var(--muted); font-size: 12.5px; }
  .nothing .hint { font-size: 13px; }
  .empty { color: var(--muted); padding: 40px 0; text-align: center; }
  dialog {
    border: none; border-radius: 12px; padding: 0; max-width: 96vw; max-height: 96vh;
    background: var(--paper);
  }
  dialog::backdrop { background: rgba(10, 13, 18, .72); }
  dialog img { display: block; max-width: 96vw; max-height: 90vh; width: auto; }
  dialog .bar {
    display: flex; justify-content: space-between; align-items: center;
    padding: 8px 14px; font-size: 13px; color: var(--muted); border-top: 1px solid var(--line);
  }
  #jsonBox { width: min(760px, 94vw); }
  #jsonText {
    display: block; width: 100%; height: 62vh; border: none; resize: none; padding: 14px;
    background: var(--paper); color: var(--ink);
    font: 12px/1.55 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  #jsonText:focus { outline: none; }
  .viewer-nav { display: flex; gap: 8px; align-items: center; }
  /* The page is the thing being read, so it is sized by the screen it is read
     on: as tall as the screen allows, and as wide as that height makes it.
     A page is taller than it is wide, so binding the width instead was
     binding the wrong edge - it left the page overflowing the dialog on any
     ordinary laptop, which is the scrolling this was meant to avoid. */
  #viewer { display: flex; flex-direction: column; max-height: 96vh; overflow: hidden; }
  /* min-height:0, or a flex item will not shrink below its content and the
     dialog grows past its own max-height instead of the panel scrolling. */
  #viewerScroll { flex: 1 1 auto; min-height: 0; overflow-y: auto; }
  #viewerImg {
    display: block; margin: 0 auto;
    max-height: 88vh; max-width: 92vw; width: auto; height: auto;
  }
  #viewer .bar { position: sticky; bottom: 0; z-index: 2; background: var(--paper); }
  .viewer-data {
    display: grid; gap: 12px; padding: 12px 14px 16px; overflow-y: auto;
    grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
    border-top: 1px solid var(--line); background: var(--ground);
  }
  .viewer-data .pane { background: var(--paper); }
  .viewer-data .rows { max-height: 22vh; }
  .viewer-data .pane.links h3 { color: var(--link); }
  /* Back and Next are what you press over and over, so they look like it. */
  dialog button.step {
    border: 2px solid var(--ink); font-weight: 700; padding: 4px 14px;
  }
  dialog button.step:hover:not([disabled]) { background: var(--ink); color: var(--paper); }
  dialog button[disabled] { opacity: .4; cursor: default; }
  #viewerPdf {
    display: block; margin: 0 auto;
    width: min(900px, 92vw); height: 88vh; border: none; background: #fff;
  }
  /* An id selector beats the browser's own [hidden] { display: none }, so the
     rule above kept the frame in the layout however often the attribute was
     set - a blank 700px slab under every page, and the gap under the image. */
  #viewerImg[hidden], #viewerPdf[hidden] { display: none; }
  dialog button {
    border: 1px solid var(--line); background: transparent; color: var(--ink);
    border-radius: 6px; padding: 4px 12px; cursor: pointer; font: inherit; font-size: 13px;
  }
</style>
</head>
<body>
<header>
  <h1>Current Form Output</h1>
  <span class="sub-project" id="projectLabel"></span>
  <span class="stamp" id="stamp"><span class="dot" id="dot"></span>loading…</span>
  <nav id="nav"></nav>
  <a class="btn-rules" href="form-rules.html">📏 Rules →</a>
</header>

<main id="main">
  <p class="empty">Reading <code>Current Form Output/</code>…</p>
</main>

<dialog id="viewer">
  <div id="viewerScroll">
    <img id="viewerImg" alt="">
    <iframe id="viewerPdf" title="PDF" hidden></iframe>
    <div id="viewerData" class="viewer-data"></div>
  </div>
  <div class="bar">
    <span id="viewerLabel"></span>
    <span class="viewer-nav">
      <button id="viewerPrev" class="step" title="Previous page (←)">← Back</button>
      <button id="viewerNext" class="step" title="Next page (→)">Next →</button>
      <button id="viewerCopy" title="Copy this page as JSON">Copy data</button>
      <button id="viewerPdfToggle" title="Show the PDF itself">View PDF</button>
      <button id="viewerClose">Close</button>
    </span>
  </div>
</dialog>

<dialog id="jsonBox">
  <textarea id="jsonText" spellcheck="false" readonly></textarea>
  <div class="bar">
    <span id="jsonLabel"></span>
    <span>Selected — press Ctrl+C &nbsp; <button id="jsonClose">Close</button></span>
  </div>
</dialog>

<script>
/*
 * A window onto the folder the audit publishes, refreshed every three seconds.
 *
 * The images are files on disk that a pipeline run replaces, so the page cannot
 * be told when they change - it asks. Two things are polled and they are not
 * the same question: the manifest says which forms and how many pages exist,
 * and each image carries a cache-busting stamp so the browser fetches the new
 * bytes rather than showing the ones it already has.
 *
 * The layout is only rebuilt when the shape changes - a form added, a page
 * count different. Rebuilding every three seconds would throw away the scroll
 * position and flash every image, which is exactly what you do not want while
 * you are reading one.
 */
/*
 * Which project's output this page is showing.
 *
 * A link handed out for one project has to keep pointing at that project, so
 * the id comes from the URL and nothing else decides it. Without one the page
 * offers what has been published, most recent first, and follows the reader's
 * choice - which is what you want when you arrive without a link, and never
 * what you want when you arrived with one.
 */
const OUTPUT_ROOT = 'Current Form Output';
const EVERY_MS = 3000;
const params = new URLSearchParams(location.search);
let PROJECT = params.get('project') || '';
let ROOT = OUTPUT_ROOT + (PROJECT ? '/' + PROJECT : '');

let shape = '';
let missCount = 0;
let currentStamp = '';

const el = (tag, attrs, kids) => {
  const node = document.createElement(tag);
  Object.entries(attrs || {}).forEach(([k, v]) => {
    if (k === 'class') node.className = v; else node.setAttribute(k, v);
  });
  (kids || []).forEach((k) => node.appendChild(k));
  return node;
};
const text = (s) => document.createTextNode(s);
const pad = (n) => String(n).padStart(2, '0');
const src = (form, n, stamp) =>
  ROOT + '/' + form + '/page-' + pad(n) + '.png?v=' + encodeURIComponent(stamp);

function build(manifest) {
  const main = document.getElementById('main');
  const nav = document.getElementById('nav');
  main.textContent = '';
  nav.textContent = '';

  if (!manifest.forms.length) {
    main.appendChild(el('p', { class: 'empty' }, [text('Nothing published yet.')]));
    return;
  }

  manifest.forms.forEach((form) => {
    nav.appendChild(el('a', { href: '#' + form.name }, [text(form.name)]));

    const grid = el('div', { class: 'pages' });
    for (let n = 1; n <= form.pages; n++) {
      const img = el('img', {
        src: src(form.name, n, manifest.publishedAt),
        alt: form.name + ' page ' + n, loading: 'lazy',
        'data-form': form.name, 'data-page': String(n)
      });
      img.addEventListener('click', () => open(img));
      grid.appendChild(el('figure', {}, [
        img,
        el('figcaption', {}, [
          text('Page ' + n),
          copyPageButton(form.name, n)
        ]),
        pagePanel(form.name, n)
      ]));
    }

    const section = el('section', { id: form.name }, [
      el('div', { class: 'form-head' }, [
        el('h2', {}, [text(form.name)]),
        el('span', { class: 'count' }, [text(form.pages + ' page' + (form.pages === 1 ? '' : 's'))])
      ]),
      grid,
      dataPanel(form)
    ]);
    main.appendChild(section);
    // The verdict for every page of this form, without waiting to be asked.
    summariseForm(form.name, manifest.publishedAt);
  });
}

/**
 * Hand the whole page over as JSON: which form, which page, and every field on
 * it with its value.
 *
 * Blanks are included deliberately, and so is the count of them. The reason to
 * copy a page is usually to ask a question about it, and "these four are empty"
 * is the question - a payload listing only what was filled answers a different
 * one and looks reassuring while doing it.
 *
 * Buttons are left out. They are not fields anybody fills; they are the Print
 * and Save controls and the form-number links, and including them would pad
 * every page with rows nobody can act on.
 */
function pageDataFor(form, page, byPage, why) {
  const reasons = (why && why.fields) || {};
  const fields = ((byPage && byPage[page]) || [])
    .filter(function (f) { return f.kind !== 'button'; })
    .map(function (f) {
      const row = { name: f.name, kind: f.kind, value: f.value };
      const reason = isBlank(f) ? reasons[f.name] : null;
      // Why it is empty travels with it: the copied page is usually the start
      // of a question about a blank, and the answer is often already known.
      if (reason && reason.verdict === 'closed') {
        row.emptyBecause = reason.gate
          ? (reason.gate + (reason.wanted ? ' — needed "' + reason.wanted + '"' : ''))
          : 'an answer closed this branch';
      } else if (reason && reason.verdict === 'defect') {
        row.emptyBecause = 'UNEXPLAINED';
      }
      return row;
    });
  const counts = { fields: fields.length, empty: 0, unexplained: 0, text: 0, filled: 0,
    checkbox: 0, ticked: 0 };
  fields.forEach(function (f) {
    if (isBlank(f)) counts.empty++;
    if (f.emptyBecause === 'UNEXPLAINED') counts.unexplained++;
    if (f.kind === 'checkbox') { counts.checkbox++; if (f.value === true) counts.ticked++; }
    else { counts.text++; if (!isBlank(f)) counts.filled++; }
  });
  return {
    project: PROJECT || null,
    form: form,
    page: page,
    publishedAt: currentStamp || null,
    counts: counts,
    fields: fields
  };
}

function copyPageButton(form, n) {
  const btn = el('button', { class: 'copy-page', type: 'button',
    title: 'Copy this page as JSON, blank fields included' });
  btn.textContent = 'Copy page data';
  btn.addEventListener('click', async function (e) {
    e.stopPropagation();
    const byPage = await fieldsFor(form, currentStamp);
    const why = await whyFor(form, currentStamp);
    const json = JSON.stringify(pageDataFor(form, n, byPage, why), null, 2);
    const done = function (ok) {
      btn.textContent = ok ? 'Copied' : 'Press Ctrl+C';
      btn.className = 'copy-page' + (ok ? ' done' : '');
      setTimeout(function () {
        btn.textContent = 'Copy page data'; btn.className = 'copy-page';
      }, 1600);
    };
    let ok = false;
    try {
      await navigator.clipboard.writeText(json);
      ok = true;
    } catch (err) {
      ok = false;
    }
    if (ok) { done(true); return; }
    // Clipboard access can be refused - an unfocused tab, a browser that wants
    // a gesture it did not see. Put the text on screen, selected, and say so.
    // The old fallback removed the textarea it had just selected, so the
    // message said press Ctrl+C over a selection that no longer existed.
    showJson(form + ' — page ' + n, json);
    done(false);
  });
  return btn;
}

/**
 * The fields printed on one page, and what each of them holds.
 *
 * Tied to the page rather than to the form, because a blank is a fact about a
 * place on paper: "item 6 is empty" is a sentence about page two. Empty fields
 * are listed first and marked, since a field nobody filled is the one worth
 * looking at and a list that buries it reads as though everything is fine.
 */
function pagePanel(form, n) {
  const wrap = el('details', { class: 'page' });
  let sharedHere = [];
  const summary = el('summary', {}, [text('Field data'), el('span', {}, [text('reading…')])]);
  const rows = el('div', { class: 'rows' });
  wrap.append(summary, rows);

  const readPage = function (fields, why) {
    const reasons = (why && why.fields) || {};
    const real = ((fields && fields[n]) || []).filter(function (f) { return f.kind !== 'button'; });
    const blank = real.filter(isBlank);
    const unexplained = blank.filter(function (f) {
      const r = reasons[f.name];
      return f.kind !== 'checkbox' && r && (r.verdict === 'defect' || r.verdict === 'unmapped');
    });
    return { reasons: reasons, real: real, blank: blank, unexplained: unexplained };
  };

  /**
   * The verdict, without opening anything.
   *
   * The counts are the reason to open a page, so making you open it to see them
   * is backwards - the whole point is to skim thirty-three pages and stop at the
   * one with something wrong. The rows stay behind the click; the number does
   * not.
   */
  const summarise = function (fields, why) {
    const s = readPage(fields, why);
    // An empty field is only worth alarm when nothing accounts for it.
    summary.lastChild.textContent = s.real.length + ' fields'
      + (s.blank.length ? ' · ' + s.blank.length + ' empty' : '')
      + (s.blank.length ? (s.unexplained.length
          ? ' · ' + s.unexplained.length + ' unexplained' : ' · all accounted for') : '');
    summary.lastChild.className = s.unexplained.length ? 'miss' : (s.blank.length ? 'ok' : '');
  };

  const paint = function (fields, why) {
    summarise(fields, why);
    const s = readPage(fields, why);
    rows.textContent = '';
    if (!s.real.length) {
      rows.appendChild(el('p', { class: 'empty' }, [text('No fields on this page.')]));
      return;
    }
    const sharedBy = {};
    sharedHere.forEach(function (s2) { sharedBy[s2.name] = s2; });
    s.blank.concat(s.real.filter(function (f) { return !isBlank(f); })).forEach(function (f) {
      const row = fieldRow(f, s.reasons);
      const share = sharedBy[f.name];
      if (share && share.to && share.to.length) {
        row.appendChild(el('span', { class: 'shared' + (share.caption ? ' caption' : '') }, [text(
          share.caption
            ? 'the caption — printed on every page of the packet'
            : '↔ also on ' + share.to.slice(0, 6).map(function (p) {
                return p.form + ' p' + p.page; }).join(', ')
              + (share.to.length > 6 ? ' and ' + (share.to.length - 6) + ' more' : ''))]));
      }
      rows.appendChild(row);
    });
  };

  let paintedFor = null;
  wrap.addEventListener('toggle', function () {
    if (!wrap.open || paintedFor === currentStamp) return;
    paintedFor = currentStamp;
    Promise.all([fieldsFor(form, currentStamp), whyFor(form, currentStamp)])
      .then(function (both) { paint(both[0], both[1]); });
  });
  wrap.dataset.form = form;
  wrap.dataset.page = String(n);
  wrap.__paint = paint;
  wrap.__summarise = summarise;
  wrap.__links = function (links) {
    sharedHere = ((links && links[n]) || {}).fields || [];
    paintLinks(wrap.parentNode, form, n, links);
  };
  return wrap;
}

/**
 * Fill in every page's verdict for one form, with a single pair of fetches.
 *
 * Both files are cached per publish, so thirty-three pages cost five requests
 * rather than sixty-six.
 */
function summariseForm(name, stamp) {
  return Promise.all([fieldsFor(name, stamp), whyFor(name, stamp), linksFor(name, stamp)])
    .then(function (all) {
      document.querySelectorAll('details.page[data-form="' + name + '"]').forEach(function (d) {
        if (d.__summarise) d.__summarise(all[0], all[1]);
        if (d.__links) d.__links(all[2]);
      });
    });
}

/**
 * Say that this page is wired to others, and to which.
 *
 * A shared field name is how one answer reaches every form that prints it, and
 * nothing on the page shows it - the connection is real, load-bearing and
 * invisible. A page that shares something is outlined and names the forms; the
 * field list then says which field goes where.
 */
function paintLinks(fig, form, page, links) {
  const entry = (links && links[page]) || null;
  fig.querySelectorAll('.link-bar, .connector-bar').forEach(function (n) { n.remove(); });
  fig.classList.remove('linked');
  if (!entry) return;
  const anchor = fig.querySelector('details.page');

  // A connector before a shared name, because it is the stronger claim: a
  // shared name carries an answer to a form that is being filed anyway, and a
  // connector decides whether that form is filed at all.
  //
  // It is also independent of sharing, which is why this comes first. DV-100
  // page 5 is the page that brings in DV-101 and shares nothing else, so
  // returning early on "no shared fields" hid the one connector on the packet
  // that the overflow rule exists to trigger.
  (entry.connectors || []).forEach(function (c) {
    fig.classList.add('linked');
    fig.insertBefore(el('div', { class: 'connector-bar' }, [
      el('b', {}, [text('⇒ brings in ' + c.to)]),
      el('span', { class: c.on ? '' : 'off' }, [text(
        c.name + (c.answer ? ' = "' + c.answer + '"' : '')
        + (c.on ? '' : ' — not chosen in this run'))])
    ]), anchor);
  });

  // The caption reaches every page by construction, so counting it would mark
  // all thirty-three and separate nothing. Only a name that actually travels
  // makes a page worth pointing at.
  if (!entry.substantive) return;

  const others = (entry.forms || []).filter(function (f) { return f !== form; });
  fig.classList.add('linked');
  // Before the field panel, so it reads as a property of the page.
  fig.insertBefore(el('div', { class: 'link-bar' }, [
    el('b', {}, [text('↔ ' + entry.substantive
      + (entry.substantive === 1 ? ' field shared with' : ' fields shared with'))]),
    el('span', { class: 'to' }, [text(others.length
      ? others.join(', ')
      : 'other pages of this form')])
  ]), anchor);
}

function isBlank(f) {
  return f.kind === 'checkbox' ? f.value !== true
    : String(f.value == null ? '' : f.value).trim() === '';
}

function fieldRow(f, why) {
  const blank = isBlank(f);
  const value = el('span', { class: 'v' + (f.kind === 'checkbox' ? (f.value ? ' on' : ' off') : '') });
  value.textContent = f.kind === 'checkbox'
    ? (f.value ? 'ticked' : 'not ticked')
    : (blank ? '(empty)' : String(f.value));

  const reason = blank && why ? why[f.name] : null;
  const unexplained = blank && f.kind !== 'checkbox' && reason
    && (reason.verdict === 'defect' || reason.verdict === 'unmapped');
  const row = el('div', { class: 'row' + (blank ? ' blank' : '') + (unexplained ? ' unexplained' : '') }, [
    el('span', { class: 'k' }, [text(f.name)]),
    value
  ]);
  if (reason && reason.verdict === 'closed' && reason.gate) {
    row.appendChild(el('span', { class: 'why' }, [text(
      'closed by: ' + reason.gate + (reason.wanted ? '  —  needed "' + reason.wanted + '"' : ''))]));
  } else if (reason && reason.verdict === 'court') {
    row.appendChild(el('span', { class: 'why' }, [text('the court completes this')]));
  } else if (reason && reason.verdict === 'overflow') {
    row.appendChild(el('span', { class: 'why' }, [text(
      'a continuation line — the answer fit on the line above')]));
  } else if (unexplained) {
    row.appendChild(el('span', { class: 'why' }, [text(
      'nothing accounts for this being empty')]));
  }
  return row;
}

/** One fetch of a form's field data per publish, shared by its pages. */
const fieldCache = {};
function fieldsFor(form, stamp) {
  const key = form + '@' + stamp;
  if (!fieldCache[key]) {
    fieldCache[key] = fetch(ROOT + '/' + form + '/fields.json?v=' + encodeURIComponent(stamp),
      { cache: 'no-store' })
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .catch(function () { return {}; });
  }
  return fieldCache[key];
}

/**
 * Why each blank is blank.
 *
 * An empty field on a court form is either an answer having closed the branch
 * it belongs to, or a defect - and on the page they look the same. Counting
 * empties without saying which is which is how DV-105 page 6 reads as seventy
 * missing answers when it is one branch the filer did not take.
 */
/** Which pages this one is wired to, cached per publish like the rest. */
const linkCache = {};
function linksFor(form, stamp) {
  const key = form + '@' + stamp;
  if (!linkCache[key]) {
    linkCache[key] = fetch(ROOT + '/' + form + '/links.json?v=' + encodeURIComponent(stamp),
      { cache: 'no-store' })
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .catch(function () { return {}; });
  }
  return linkCache[key];
}

const whyCache = {};
function whyFor(form, stamp) {
  const key = form + '@' + stamp;
  if (!whyCache[key]) {
    whyCache[key] = fetch(ROOT + '/' + form + '/why.json?v=' + encodeURIComponent(stamp),
      { cache: 'no-store' })
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .catch(function () { return { fields: {} }; });
  }
  return whyCache[key];
}

/**
 * What the PDF ended up holding, beside the pictures of it.
 *
 * The images show where a value printed and this shows what the field is
 * called and what is in it - the other half of reading an output, and the half
 * you cannot get by looking at a page. Checkboxes and text boxes are kept
 * apart because the questions you ask of them are different: a checkbox is
 * ticked or it is not, and a text box is right, wrong, or empty.
 *
 * It is collapsed by default. Thirty-two fields is a list; three hundred and
 * twenty-one is a wall, and the pages are what you came to look at.
 */
function dataPanel(form) {
  const counts = form.fields || { text: 0, checkbox: 0, ticked: 0, filled: 0 };
  const wrap = el('details', { class: 'data' });
  const summary = el('summary', {}, [
    text('PDF Data'),
    el('span', { class: 'pill' }, [text(counts.text + ' text · ' + counts.filled + ' filled')]),
    el('span', { class: 'pill' }, [text(counts.checkbox + ' checkboxes · ' + counts.ticked + ' ticked')])
  ]);
  const panes = el('div', { class: 'panes' });
  panes.appendChild(el('p', { class: 'empty' }, [text('Loading field values…')]));
  wrap.append(summary, panes);

  // Only fetched when it is opened, and only once per publish.
  let loadedFor = null;
  wrap.addEventListener('toggle', function () {
    if (!wrap.open || loadedFor === currentStamp) return;
    loadedFor = currentStamp;
    loadFields(form.name, panes, currentStamp);
  });
  wrap.dataset.form = form.name;
  return wrap;
}

async function loadFields(name, panes, stamp) {
  try {
    const byPage = await fieldsFor(name, stamp);
    // Flattened for the form-level view, in page order, buttons dropped.
    const fields = Object.keys(byPage)
      .sort(function (a, b) { return Number(a) - Number(b); })
      .reduce(function (all, n) {
        return all.concat(byPage[n].filter(function (f) { return f.kind !== 'button'; })
          .map(function (f) { return Object.assign({ page: Number(n) }, f); }));
      }, []);
    if (!fields.length) throw new Error('no fields');
    panes.textContent = '';
    panes.appendChild(pane('Text fields',
      fields.filter(function (f) { return f.kind !== 'checkbox'; }), false));
    panes.appendChild(pane('Checkboxes',
      fields.filter(function (f) { return f.kind === 'checkbox'; }), true));
  } catch (err) {
    panes.textContent = '';
    panes.appendChild(el('p', { class: 'empty' },
      [text('No field data — re-run node pipeline-current-output.js')]));
  }
}

function pane(title, fields, isCheckbox) {
  const rows = el('div', { class: 'rows' });
  const draw = function (needle) {
    rows.textContent = '';
    const shown = fields.filter(function (f) {
      return !needle || f.name.toLowerCase().indexOf(needle) >= 0
        || String(f.value == null ? '' : f.value).toLowerCase().indexOf(needle) >= 0;
    });
    if (!shown.length) {
      rows.appendChild(el('p', { class: 'empty' }, [text('Nothing matches.')]));
      return;
    }
    // Empty first: a field nobody filled is the one worth looking at.
    shown.slice().sort(function (a, b) { return (isBlank(b) ? 0 : 1) - (isBlank(a) ? 0 : 1); })
      .forEach(function (f) {
        const row = fieldRow(f);
        if (f.page) row.querySelector('.k').textContent = 'p' + f.page + '  ' + f.name;
        rows.appendChild(row);
      });
  };

  const filter = el('input', { class: 'filter', type: 'search', placeholder: 'filter…' });
  filter.addEventListener('input', function () { draw(filter.value.trim().toLowerCase()); });
  draw('');

  return el('div', { class: 'pane' }, [
    el('h3', {}, [text(title + ' (' + fields.length + ')'), filter]),
    rows
  ]);
}

/** Same pictures, newer bytes: swap the stamp without touching the layout. */
function refreshImages(stamp) {
  document.querySelectorAll('#main img').forEach((img) => {
    const next = src(img.dataset.form, Number(img.dataset.page), stamp);
    if (img.getAttribute('src') !== next) img.setAttribute('src', next);
  });
}

function setStatus(state, label) {
  document.getElementById('dot').className = 'dot' + (state ? ' ' + state : '');
  document.getElementById('stamp').lastChild.nodeValue = label;
}

/**
 * Say what is missing and what to do about it.
 *
 * A project id that no run has written is not an error, it is a project that
 * has not been through the loop yet - most often because the editor is holding
 * a different project from the one that was published. Naming both, and
 * linking the ones that do have output, turns a dead end into a next step.
 */
async function showNothingPublished() {
  const main = document.getElementById('main');
  if (main.dataset.state === 'empty') return;
  main.dataset.state = 'empty';
  main.textContent = '';

  const box = el('div', { class: 'nothing' });
  box.appendChild(el('h2', {}, [text('No pages published for this project')]));
  box.appendChild(el('p', {}, [
    text('This dashboard is showing '),
    el('code', {}, [text(PROJECT || '(no project)')]),
    text(', and no run has written any output under it.')
  ]));
  box.appendChild(el('p', {}, [text('Run a pass for it:')]));
  box.appendChild(el('pre', {}, [text(
    'node pipeline-fill.js --render\nnode pipeline-current-output.js')]));

  let index = [];
  try {
    const res = await fetch(OUTPUT_ROOT + '/index.json?t=' + Date.now(), { cache: 'no-store' });
    if (res.ok) index = await res.json();
  } catch (e) { /* nothing published at all */ }
  const others = index.filter(function (p) { return p && p.id !== PROJECT; });

  if (others.length) {
    box.appendChild(el('p', {}, [text('Or open a project that has output:')]));
    const list = el('div', { class: 'others' });
    others.forEach(function (p) {
      const a = el('a', { href: '?project=' + encodeURIComponent(p.id) }, [
        el('strong', {}, [text(p.id)]),
        el('span', {}, [text(p.pages + ' pages · ' + (p.forms || []).join(', '))])
      ]);
      list.appendChild(a);
    });
    box.appendChild(list);
    box.appendChild(el('p', { class: 'hint' }, [text(
      'Seeing a project you did not expect usually means the editor is holding a '
      + 'different one. Import that project\u2019s JSON and press View PDF Output again.')]));
  }

  main.appendChild(box);
}

/** Offer what has been published, when the link did not say. */
async function offerProjects() {
  let index = [];
  try {
    const res = await fetch(OUTPUT_ROOT + '/index.json?t=' + Date.now(), { cache: 'no-store' });
    if (res.ok) index = await res.json();
  } catch (e) { /* nothing published yet */ }
  if (!index.length) return false;

  if (!PROJECT) {
    PROJECT = index[0].id;
    ROOT = OUTPUT_ROOT + '/' + PROJECT;
    history.replaceState(null, '', '?project=' + encodeURIComponent(PROJECT));
  }
  if (index.length > 1) {
    const pick = el('select', { class: 'project-pick', title: 'Published projects' });
    index.forEach(function (p) {
      const opt = el('option', { value: p.id }, [text(p.id + '  ·  ' + p.pages + ' pages')]);
      if (p.id === PROJECT) opt.setAttribute('selected', 'selected');
      pick.appendChild(opt);
    });
    pick.addEventListener('change', function () {
      location.search = '?project=' + encodeURIComponent(pick.value);
    });
    document.getElementById('stamp').after(pick);
  }
  return true;
}

async function poll() {
  try {
    const res = await fetch(ROOT + '/manifest.json?t=' + Date.now(), { cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const manifest = await res.json();
    missCount = 0;

    const fresh = manifest.publishedAt !== currentStamp;
    currentStamp = manifest.publishedAt;

    document.getElementById('main').dataset.state = '';
    const next = JSON.stringify(manifest.forms);
    if (next !== shape) { shape = next; build(manifest); }
    else if (fresh) {
      refreshImages(manifest.publishedAt);
      // A panel left open should follow the new run rather than keep showing
      // the values from the last one.
      document.querySelectorAll('details.data[open]').forEach(function (d) {
        loadFields(d.dataset.form, d.querySelector('.panes'), manifest.publishedAt);
      });
      (manifest.forms || []).forEach(function (f) {
        summariseForm(f.name, manifest.publishedAt);
      });
      document.querySelectorAll('details.page[open]').forEach(function (d) {
        Promise.all([fieldsFor(d.dataset.form, manifest.publishedAt),
                     whyFor(d.dataset.form, manifest.publishedAt)])
          .then(function (both) { d.__paint(both[0], both[1]); });
      });
    }

    document.getElementById('projectLabel').textContent = manifest.projectId || PROJECT || '';
    const when = new Date(manifest.publishedAt);
    const age = Math.round((Date.now() - when.getTime()) / 1000);
    setStatus(age > 3600 ? 'stale' : '',
      'published ' + when.toLocaleTimeString() + ' · ' + describeAge(age));
  } catch (err) {
    missCount++;
    if (missCount > 1) {
      setStatus('gone', 'nothing published for this project yet');
      showNothingPublished();
    }
  }
}

function describeAge(seconds) {
  if (seconds < 90) return 'just now';
  if (seconds < 5400) return Math.round(seconds / 60) + ' min ago';
  return Math.round(seconds / 3600) + ' h ago';
}

/**
 * Last resort for the clipboard: show the text, selected, and let the keyboard
 * do it. Anything that promises a copy it did not make is worse than asking.
 */
function showJson(label, json) {
  const dlg = document.getElementById('jsonBox');
  const area = document.getElementById('jsonText');
  document.getElementById('jsonLabel').textContent = label;
  area.value = json;
  dlg.showModal();
  area.focus();
  area.select();
}

/*
 * The lightbox, and moving between pages without leaving it.
 *
 * The order is the order on the page: every page of every form, DV-100 page 1
 * through DV-110 page 9. Reading a filled packet means going through it front
 * to back, and stopping at a form boundary to close, scroll and re-open would
 * make thirty-three pages feel like five separate jobs.
 *
 * The ends are dead rather than wrapping. Wrapping from the last page to the
 * first reads as a bug when you did not mean it, and a disabled button says
 * plainly that this is the end of the packet.
 */
const viewer = document.getElementById('viewer');
const viewerPrev = document.getElementById('viewerPrev');
const viewerNext = document.getElementById('viewerNext');
let viewerAt = -1;

function viewerPages() {
  return [].slice.call(document.querySelectorAll('#main img[data-form]'));
}

function showAt(index) {
  const pages = viewerPages();
  if (index < 0 || index >= pages.length) return;
  const img = pages[index];
  viewerAt = index;
  document.getElementById('viewerImg').src = img.getAttribute('src');
  document.getElementById('viewerLabel').textContent =
    img.dataset.form + ' — page ' + img.dataset.page
    + '   (' + (index + 1) + ' of ' + pages.length + ')';
  viewerPrev.disabled = index === 0;
  viewerNext.disabled = index === pages.length - 1;
  paintViewerData(img.dataset.form, Number(img.dataset.page));
  if (showingPdf) loadViewerPdf();
  const scroller = document.getElementById('viewerScroll');
  if (scroller) scroller.scrollTop = 0;
  // Keep the thumbnail behind the dialog in view, so closing leaves you where
  // you got to rather than back where you started.
  img.scrollIntoView({ block: 'center' });
}

/**
 * Everything the page holds, under the page.
 *
 * Enlarging a page is what you do when you want to look closely, and looking
 * closely is exactly when you want the names and values rather than only the
 * picture. Three lists rather than one: text boxes, checkboxes, and what this
 * page shares with the rest of the packet - a shared name being the wiring
 * here, and the one thing the paper cannot show you at all.
 */
function paintViewerData(form, page) {
  const host = document.getElementById('viewerData');
  host.textContent = '';
  host.appendChild(el('p', { class: 'empty' }, [text('Reading field data…')]));
  Promise.all([fieldsFor(form, currentStamp), whyFor(form, currentStamp),
               linksFor(form, currentStamp)]).then(function (all) {
    // A later page may have been opened while this was in flight.
    const now = viewerPages()[viewerAt];
    if (!now || now.dataset.form !== form || Number(now.dataset.page) !== page) return;

    const reasons = (all[1] && all[1].fields) || {};
    const all3 = ((all[0] && all[0][page]) || []).filter(function (f) { return f.kind !== 'button'; });
    const linkEntry = (all[2] && all[2][page]) || { fields: [] };
    const sharedBy = {};
    (linkEntry.fields || []).forEach(function (s) { sharedBy[s.name] = s; });

    const build = function (title, fields, extra) {
      const rows = el('div', { class: 'rows' });
      if (!fields.length) {
        rows.appendChild(el('p', { class: 'empty' }, [text('None on this page.')]));
      } else {
        fields.slice().sort(function (a, b) {
          return (isBlank(b) ? 0 : 1) - (isBlank(a) ? 0 : 1);
        }).forEach(function (f) { rows.appendChild(fieldRow(f, reasons)); });
      }
      return el('div', { class: 'pane' + (extra || '') }, [
        el('h3', {}, [text(title + ' (' + fields.length + ')')]), rows
      ]);
    };

    host.textContent = '';
    host.appendChild(build('Text fields', all3.filter(function (f) { return f.kind !== 'checkbox'; })));
    host.appendChild(build('Checkboxes', all3.filter(function (f) { return f.kind === 'checkbox'; })));

    // The connections, with the value that travels along them.
    const conn = el('div', { class: 'rows' });
    const shared = (linkEntry.fields || []);
    if (!shared.length) {
      conn.appendChild(el('p', { class: 'empty' }, [text('Nothing on this page is shared.')]));
    } else {
      shared.forEach(function (s) {
        const field = all3.find(function (f) { return f.name === s.name; }) || {};
        const row = fieldRow(field.name ? field : { name: s.name, kind: s.kind, value: '' }, reasons);
        row.appendChild(el('span', { class: 'shared' + (s.caption ? ' caption' : '') }, [text(
          s.caption
            ? 'the caption — printed on every page of the packet'
            : '↔ ' + s.to.map(function (p) { return p.form + ' p' + p.page; }).join(', '))]));
        conn.appendChild(row);
      });
    }
    // Connectors first: they are about whether a form exists at all.
    (linkEntry.connectors || []).forEach(function (c) {
      const row = el('div', { class: 'row' }, [
        el('span', { class: 'k' }, [text(c.name)]),
        el('span', { class: 'v' + (c.on ? ' on' : ' off') }, [text(c.on ? 'chosen' : 'not chosen')])
      ]);
      row.appendChild(el('span', { class: 'shared' }, [text(
        '⇒ brings in ' + c.to + (c.answer ? '  (when "' + c.answer + '")' : ''))]));
      conn.insertBefore(row, conn.firstChild);
    });
    const total = shared.length + (linkEntry.connectors || []).length;
    host.appendChild(el('div', { class: 'pane links' }, [
      el('h3', {}, [text('Form connections (' + total + ')')]), conn
    ]));
  });
}

function open(img) {
  // Always opens on the picture.
  //
  // The mode used to outlive the dialog: read a page as a PDF, close, open any
  // other page, and the frame came back still holding the PDF of the page
  // before - a white slab where the image should be, on a viewer that had
  // apparently ignored Close. Resetting here rather than on the dialog's close
  // event because this browser does not fire that event for dialog.close(),
  // and opening is the moment that has to be right anyway. Back and Next do
  // not reset, so paging through the PDFs stays in the PDFs.
  setViewerMode(false);
  showAt(viewerPages().indexOf(img));
  viewer.showModal();
}

/**
 * The picture, or the document itself.
 *
 * A rendered page is what you skim; the PDF is what you reach for when you
 * want to select the text, zoom without it going soft, or check that the
 * viewer everyone else will use shows the same thing. Same page either way -
 * the PDF opens at the page you were looking at.
 */
let showingPdf = false;
function setViewerMode(pdf) {
  showingPdf = !!pdf;
  const img = document.getElementById('viewerImg');
  const frame = document.getElementById('viewerPdf');
  const btn = document.getElementById('viewerPdfToggle');
  img.hidden = showingPdf;
  frame.hidden = !showingPdf;
  btn.textContent = showingPdf ? 'View image' : 'View PDF';
  if (showingPdf) loadViewerPdf(); else frame.removeAttribute('src');
}

function loadViewerPdf() {
  const page = viewerPages()[viewerAt];
  if (!page) return;
  // Out of the published run, which is self-contained, rather than out of
  // pipeline-out - that is scratch, the next fill overwrites it, and it is not
  // in the repository. A run published on one machine and opened on another
  // showed its pages and 404ed on the document.
  const url = ROOT + '/' + page.dataset.form + '/filled.pdf'
    + '#page=' + page.dataset.page;
  const frame = document.getElementById('viewerPdf');
  if (frame.getAttribute('src') !== url) frame.setAttribute('src', url);
}

document.getElementById('viewerPdfToggle').addEventListener('click', function () {
  setViewerMode(!showingPdf);
});

// Closing puts it back to the picture.
//
// Without this the mode outlived the dialog: close while reading the PDF, open
// any other page, and the frame came back still holding the PDF of the page
// before - a white slab where the image should be, on a viewer that had
// apparently ignored Close. Nothing on screen said which page it was showing,
// because it was showing the wrong one.
viewer.addEventListener('close', function () { setViewerMode(false); });   // where it fires

document.getElementById('viewerCopy').addEventListener('click', async function () {
  const img = viewerPages()[viewerAt];
  if (!img) return;
  const btn = document.getElementById('viewerCopy');
  const form = img.dataset.form, n = Number(img.dataset.page);
  const byPage = await fieldsFor(form, currentStamp);
  const why = await whyFor(form, currentStamp);
  const links = await linksFor(form, currentStamp);
  const data = pageDataFor(form, n, byPage, why);
  // The wiring travels with it: a page copied out of the viewer should carry
  // everything the viewer was showing.
  data.connectors = ((links && links[n] && links[n].connectors) || []).map(function (c) {
    return { name: c.name, bringsIn: c.to, whenAnswer: c.answer, chosen: !!c.on };
  });
  data.connections = ((links && links[n] && links[n].fields) || []).map(function (s) {
    return { name: s.name, caption: !!s.caption,
      to: s.to.map(function (p) { return p.form + ' p' + p.page; }) };
  });
  const json = JSON.stringify(data, null, 2);
  try {
    await navigator.clipboard.writeText(json);
    btn.textContent = 'Copied';
  } catch (e) {
    showJson(form + ' — page ' + n, json);
    btn.textContent = 'Press Ctrl+C';
  }
  setTimeout(function () { btn.textContent = 'Copy data'; }, 1600);
});
viewerPrev.addEventListener('click', () => showAt(viewerAt - 1));
viewerNext.addEventListener('click', () => showAt(viewerAt + 1));
viewer.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowLeft') { e.preventDefault(); showAt(viewerAt - 1); }
  if (e.key === 'ArrowRight') { e.preventDefault(); showAt(viewerAt + 1); }
});
document.getElementById('viewerClose').addEventListener('click', () => viewer.close());
const jsonBox = document.getElementById('jsonBox');
document.getElementById('jsonClose').addEventListener('click', () => jsonBox.close());
jsonBox.addEventListener('click', (e) => { if (e.target === jsonBox) jsonBox.close(); });
viewer.addEventListener('click', (e) => { if (e.target === viewer) viewer.close(); });

(async function start() {
  await offerProjects();
  await poll();
  setInterval(poll, EVERY_MS);
})();
</script>
