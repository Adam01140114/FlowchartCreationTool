const byId = Object.fromEntries(GROUPS.map((g) => [g.id, g]));
const slug = (id) => 'rule-' + id;

function render(filter) {
  const main = document.getElementById('main');
  const toc = document.getElementById('toc');
  main.textContent = ''; toc.textContent = '';
  const needle = (filter || '').trim().toLowerCase();
  let shown = 0;

  GROUPS.forEach((group) => {
    const rules = RULES.filter((r) => r.group === group.id).filter((r) =>
      !needle || (r.title + ' ' + r.says + ' ' + r.why + ' ' + r.by + ' ' + r.num)
        .toLowerCase().includes(needle));
    if (!rules.length) return;
    shown += rules.length;

    const head = document.createElement('div');
    head.className = 'group-head';
    head.innerHTML = '<h2></h2><p></p>';
    head.querySelector('h2').textContent = group.name;
    head.querySelector('p').textContent = group.blurb;
    main.appendChild(head);

    const tocHead = document.createElement('h3');
    tocHead.textContent = group.name;
    toc.appendChild(tocHead);

    rules.forEach((rule) => {
      const link = document.createElement('a');
      link.href = '#' + slug(rule.id);
      link.textContent = (rule.cornerstone ? '★ ' : '') + rule.title;
      toc.appendChild(link);

      const art = document.createElement('article');
      art.id = slug(rule.id);
      art.style.setProperty('--tag', group.tag);
      if (rule.cornerstone) art.classList.add('cornerstone');

      const h = document.createElement('div');
      h.className = 'rule-head';
      const num = document.createElement('span');
      num.className = 'num'; num.textContent = rule.num;
      const title = document.createElement('h4'); title.textContent = rule.title;
      const copy = document.createElement('button');
      copy.className = 'copy'; copy.textContent = 'Copy link';
      copy.addEventListener('click', () => {
        const url = location.origin + location.pathname + '#' + slug(rule.id);
        navigator.clipboard.writeText(url).then(
          () => { copy.textContent = 'Copied'; setTimeout(() => copy.textContent = 'Copy link', 1400); },
          () => { copy.textContent = url; }
        );
      });
      if (rule.cornerstone) {
        const tag = document.createElement('span');
        tag.className = 'cornerstone-tag'; tag.textContent = 'Cornerstone';
        h.append(num, tag, title, copy);
      } else {
        h.append(num, title, copy);
      }

      const says = document.createElement('p'); says.className = 'says'; says.textContent = rule.says;
      const why = document.createElement('p'); why.className = 'why';
      why.innerHTML = '<b>Why:</b> '; why.append(document.createTextNode(rule.why));
      const by = document.createElement('p'); by.className = 'by';
      by.innerHTML = '<b>Checked by:</b> '; by.append(document.createTextNode(rule.by));

      art.append(h, says, why, by);
      main.appendChild(art);
    });
  });

  if (!shown) main.appendChild(Object.assign(document.createElement('p'),
    { className: 'none', textContent: 'No rule matches that.' }));
  document.getElementById('count').textContent =
    shown + (needle ? ' of ' + RULES.length : '') + ' rules';
}

/**
 * Take the reader to the rule the link names and make it obvious which one it is.
 *
 * :target alone is not enough - it survives only until the next click anywhere,
 * and a link sent in conversation has to still be pointing at something when
 * the reader looks up from scrolling.
 */
function lightUp() {
  const id = decodeURIComponent(location.hash.slice(1));
  if (!id) return;
  const el = document.getElementById(id);
  if (!el) return;
  document.querySelectorAll('article.lit').forEach((a) => a.classList.remove('lit'));
  el.classList.add('lit');
  el.scrollIntoView({ behavior: 'smooth', block: 'start' });
  setTimeout(() => el.scrollIntoView({ block: 'start' }), 500);
}

document.getElementById('q').addEventListener('input', (e) => {
  render(e.target.value);
  if (!e.target.value) lightUp();
});
window.addEventListener('hashchange', lightUp);

render('');
lightUp();
</script>
