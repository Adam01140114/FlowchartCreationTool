<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Form Pipeline Rules</title>
<style>
  :root {
    --ink: #16191d; --muted: #6b7785; --line: #e4e8ee; --paper: #fff;
    --ground: #f4f6f9; --accent: #2f6fed; --mark: #fff3c4; --markline: #e8b93b;
    --tag-interview: #2f6fed; --tag-packet: #7a4fd6; --tag-page: #17845a; --tag-process: #b8632a;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ink: #e8ecf1; --muted: #98a3b3; --line: #2a3038; --paper: #1b1f25;
      --ground: #111418; --accent: #6f9dff; --mark: #3a3114; --markline: #b9922c;
      --tag-interview: #6f9dff; --tag-packet: #b18aff; --tag-page: #46c391; --tag-process: #e0975a;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--ground); color: var(--ink);
    font: 15px/1.62 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  header {
    position: sticky; top: 0; z-index: 30; background: var(--paper);
    border-bottom: 1px solid var(--line); padding: 13px 24px;
    display: flex; gap: 14px; align-items: center; flex-wrap: wrap;
  }
  h1 { margin: 0; font-size: 17px; font-weight: 650; letter-spacing: -0.01em; }
  .sub { color: var(--muted); font-size: 13px; }
  .spacer { margin-left: auto; }
  .btn {
    text-decoration: none; font-size: 13px; font-weight: 600; color: var(--ink);
    border: 1px solid var(--line); border-radius: 8px; padding: 6px 13px; background: transparent;
    cursor: pointer; font-family: inherit; display: inline-flex; align-items: center; gap: 6px;
  }
  .btn:hover { border-color: var(--accent); color: var(--accent); }
  .btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  .btn.primary:hover { filter: brightness(1.08); color: #fff; }
  #q {
    font: inherit; font-size: 13px; padding: 6px 11px; border-radius: 8px;
    border: 1px solid var(--line); background: var(--ground); color: var(--ink); width: 210px;
  }
  .wrap { display: flex; gap: 28px; max-width: 1280px; margin: 0 auto; padding: 26px 24px 80px; }
  aside {
    width: 250px; flex: none; position: sticky; top: 74px; align-self: flex-start;
    max-height: calc(100vh - 100px); overflow-y: auto;
  }
  aside h3 {
    margin: 16px 0 6px; font-size: 11px; letter-spacing: .08em; text-transform: uppercase;
    color: var(--muted); font-weight: 700;
  }
  aside h3:first-child { margin-top: 0; }
  aside a {
    display: block; text-decoration: none; color: var(--muted); font-size: 13px;
    padding: 3px 8px; border-radius: 6px; border-left: 2px solid transparent;
  }
  aside a:hover { color: var(--accent); background: var(--paper); }
  main { flex: 1; min-width: 0; }
  .group-head {
    margin: 34px 0 14px; padding-bottom: 7px; border-bottom: 1px solid var(--line);
    display: flex; align-items: baseline; gap: 10px;
  }
  .group-head:first-child { margin-top: 0; }
  .group-head h2 { margin: 0; font-size: 15px; font-weight: 650; }
  .group-head p { margin: 0; color: var(--muted); font-size: 13px; }
  article {
    background: var(--paper); border: 1px solid var(--line); border-radius: 11px;
    padding: 18px 20px; margin-bottom: 14px; scroll-margin-top: 84px;
    transition: box-shadow .2s ease, border-color .2s ease, background .2s ease;
  }
  article:target, article.lit {
    border-color: var(--markline); background: var(--mark);
    box-shadow: 0 0 0 4px rgba(232, 185, 59, .22);
  }
  .rule-head { display: flex; align-items: baseline; gap: 9px; flex-wrap: wrap; }
  .num {
    font-size: 11px; font-weight: 750; letter-spacing: .05em; color: #fff;
    background: var(--tag); border-radius: 5px; padding: 2px 7px; white-space: nowrap;
  }
  .rule-head h4 { margin: 0; font-size: 15px; font-weight: 650; flex: 1; min-width: 200px; }
  .copy {
    border: 1px solid var(--line); background: transparent; color: var(--muted);
    border-radius: 6px; font: inherit; font-size: 11px; padding: 2px 8px; cursor: pointer;
  }
  .copy:hover { color: var(--accent); border-color: var(--accent); }
  .says { margin: 10px 0 0; }
  .why, .by { margin: 9px 0 0; font-size: 13.5px; color: var(--muted); }
  .why b, .by b { color: var(--ink); font-weight: 650; }
  code {
    font: 12.5px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    background: var(--ground); border: 1px solid var(--line); border-radius: 4px; padding: 1px 5px;
  }
  .none { color: var(--muted); padding: 30px 0; }
  @media (max-width: 900px) { aside { display: none; } .wrap { padding: 20px 16px 60px; } }
</style>
</head>
<body>
<header>
  <h1>Form Pipeline Rules</h1>
  <span class="sub" id="count"></span>
  <span class="spacer"></span>
  <input id="q" type="search" placeholder="Filter rules…" autocomplete="off">
  <a class="btn primary" href="form-output-dashboard.html">🖼️ Page images →</a>
</header>

<div class="wrap">
  <aside id="toc"></aside>
  <main id="main"></main>
</div>

<script>
/*
 * Every rule this pipeline enforces, in one place, each one addressable.
 *
 * The point of the anchors is conversational: "what rule is this?" should be
 * answerable with a link that opens here, scrolls to the rule and lights it up,
 * rather than with a paragraph that has to be trusted. So each rule has a
 * stable id that never changes once published - renaming one would break every
 * link already sent - and the Copy link button hands you that address.
 *
 * Each entry says three separate things, and they are not interchangeable:
 * what the rule requires, the specific failure that caused it to be written,
 * and what actually checks it. A rule with no checker is a preference.
 */
const GROUPS = [
  { id: 'interview', name: 'The interview', tag: 'var(--tag-interview)',
    blurb: 'What gets asked, and how.' },
  { id: 'packet', name: 'The packet', tag: 'var(--tag-packet)',
    blurb: 'Several forms behaving as one.' },
  { id: 'page', name: 'The printed page', tag: 'var(--tag-page)',
    blurb: 'What the filer actually hands in.' },
  { id: 'process', name: 'Working on it', tag: 'var(--tag-process)',
    blurb: 'How a change gets made and checked.' },
];

const RULES = [
  /* ---------------- the interview ---------------- */
  { id: 'every-field-reachable', group: 'interview', num: 'Rule 1',
    title: 'Every PDF field is reachable',
    says: 'Every fillable field on the PDF must be reachable from something the form posts. A field nothing can fill is a blank on a filed document.',
    why: 'Exceptions are declared, not assumed: a court field, an overflow line, or a computed field is exempt and says so by name in the audit output.',
    by: 'pipeline-audit.js — RULE 1' },

  { id: 'no-field-names-on-screen', group: 'interview', num: 'Rule 2',
    title: 'Nothing a person reads is a field name',
    says: 'No question text, option label or placeholder may be a raw PDF field name. Wording is authored in the hints, not derived from the schema.',
    why: 'The audit once passed a packet that asked "Do you have a dV 100[0].Page4[0]...?" — which is why reading the interview is a required step and not a formality.',
    by: 'pipeline-audit.js — RULE 2, plus pipeline-review.js and a human read' },

  { id: 'repeats-are-blocks', group: 'interview', num: 'Rule 3',
    title: 'Repeated entries use a block, not flat questions',
    says: 'A numbered family of PDF fields becomes one "how many?" block whose entries carry {n}, never a run of near-identical questions.',
    why: 'Six firearms asked as eighteen questions is eighteen screens for one table.',
    by: 'pipeline-audit.js — RULE 3; the repeats hint' },

  { id: 'gated-block-starts-at-one', group: 'interview', num: 'Rule',
    title: 'A repeating block behind a gate starts at one entry',
    says: 'If a block is only reached by answering something, its minimum is one. A block on the spine keeps whatever the hint says, because there zero can be a real answer.',
    why: '"Does the person have firearms? Yes" was followed by a spinner starting at zero — offering a filer who just said yes the answer none, and a form that contradicts itself two questions apart.',
    by: 'compile-form.js — raiseMinimumForGatedBlock, which prints every block it raises' },

  { id: 'an-order-owns-its-questions', group: 'interview', num: 'Rule',
    title: 'An order owns its questions',
    says: 'When a form asks which orders you want and then asks about each one, those follow-ups gate on the option that asks for it — the whole run, not just its first question.',
    why: 'Gating only the entry moved each block and left its tail on the spine, so "Why do you have the right to live there?" was still asked of a filer who never asked anyone to move out.',
    by: 'the conditional hints; visible in pipeline-review.js as what each question waits on' },

  { id: 'computed-not-guessed', group: 'interview', num: 'Rule',
    title: 'A field the filer cannot know is computed, not asked',
    says: 'If the packet can work a value out, it does. Declaring a field computed generates no question and the form fills it when it posts.',
    why: 'DV-100 item 32 asks how many extra pages are attached. Asked as a question it gets a guess — the debug fill answered 100 — and a wrong number on a filed court document is worse than a blank one.',
    by: 'the computed hint; pipeline-audit.js lists them as exempt from Rule 1' },

  { id: 'one-question-one-thing', group: 'interview', num: 'Rule 8',
    title: 'One question asks one thing',
    says: 'A PDF box holding two answers is asked as two questions and rejoined on the way out.',
    why: 'A single box wanting a name and a date gets one of them.',
    by: 'pipeline-audit.js — RULE 8; the splits hint' },

  { id: 'one-subject-one-question', group: 'interview', num: 'Rule 9',
    title: 'Fields about one subject are one question',
    says: 'An address is one question with four boxes, not four questions.',
    why: 'Split apart, four screens ask for one address and the shape that made it obvious is gone.',
    by: 'pipeline-audit.js — RULE 9; the combines hint' },

  { id: 'ask-in-the-right-type', group: 'interview', num: 'Rule 10',
    title: 'Ask for a value in the type it is',
    says: 'Dates get a date picker, phones a keypad, money a number box.',
    why: 'A date typed free-hand arrives in a format the PDF was not expecting.',
    by: 'pipeline-audit.js — RULE 10; questions[...].type' },

  { id: 'say-what-to-enter', group: 'interview', num: 'Rule 11',
    title: 'A question says what to enter',
    says: 'The wording tells the filer what belongs in the box.',
    why: 'A label lifted from a field name tells them nothing.',
    by: 'pipeline-audit.js — RULE 11' },

  { id: 'narrative-asked-as-narrative', group: 'interview', num: 'Rule 12',
    title: 'A narrative box is asked as a narrative',
    says: 'A multi-line PDF box is asked with a multi-line question.',
    why: 'A one-line question under a ten-line box invites an answer that will not fit.',
    by: 'pipeline-audit.js — RULE 12' },

  { id: 'a-gate-must-gate', group: 'interview', num: 'Rule',
    title: 'A gate that shows its follow-up on both answers is not a gate',
    says: 'A follow-up shown on Yes and on No must either be fixed or declared always-shown with a written reason.',
    why: 'It reads as a gate and gates nothing, so nobody notices the block it was supposed to control is always on.',
    by: 'pipeline-audit.js — the gates check; the alwaysShown hint carries the reason' },

  { id: 'disqualifiers-are-declared', group: 'interview', num: 'Rule',
    title: 'What disqualifies a filer is declared and wired',
    says: 'Every "you do not qualify unless" sentence on the paper form is written down in the disqualifiers file, and every declared one has an alert node behind it.',
    why: 'A rule written down and never wired up is worse than one nobody wrote down, because it looks handled.',
    by: 'dv-packet-disqualifiers.json; pipeline-build-packet.js wires them; pipeline-disqualifiers.js --check' },

  /* ---------------- the packet ---------------- */
  { id: 'overflow-brings-in-the-form', group: 'packet', num: 'Rule',
    title: 'Running out of space is what brings in the continuation form',
    says: 'A form is never asked whether the filer needs more space. The box is measured, and past what it prints the attachment box is ticked, the continuation form switches on, and the remainder is carried onto it. Both ends of the link are dropped from the interview.',
    why: 'DV-100 item 7 ends with "Check this box if you need more space to describe the abuse. You can use form DV-101" — which asks someone to predict, before they have written a word, whether what they are about to say fits in a box whose size they cannot see. Nobody knows that. They need more space exactly when they have used more than the box holds, and the box has been measured.',
    by: 'the overflow block in the hints; compile-form.js drops both ends; applyOverflowLinks and overflowSplit in the generated runtime' },

  { id: 'no-box-asks-whether-it-will-be-needed', group: 'packet', num: 'Rule',
    title: 'No box on the packet asks whether it will be needed',
    says: 'Every "check here if you need more space" is driven by the writing, all the way down the chain. Past what the first box prints the continuation form switches on; past what both printed boxes hold, the box that says a sheet of the filer’s own is attached ticks too, and the limit comes off.',
    why: 'DV-101 item 5 carries the same escape DV-100 item 7 does, and removing one while leaving the other still asked a filer to predict whether what they were about to write would fit - one form further on. Each of the three states is knowable at the moment it happens: it fits, it fits across two boxes, or there is more of it than the packet can print. And the limit has to come off at the third, because stopping someone dead at the end of the second box is the form deciding how much of their account is worth having, when the paper itself offers them a sheet to carry on writing on.',
    by: 'the overflow declaration’s marksBeyond in dv100-hints.json; overflowSplit() returns head, tail and beyond. A field driven from another form’s declaration must be named in that form’s overflowTargets, or it is compiled as a question' },

  { id: 'the-continuation-carries-the-remainder', group: 'packet', num: 'Rule',
    title: 'The continuation carries the remainder, not a copy',
    says: 'The first box keeps what it can print and the continuation takes the rest, so the two read as one passage. The limit the filer meets is the sum of what the two boxes hold.',
    why: 'The intent was to put the whole answer on DV-101 so the attachment reads on its own, and the paper does not allow it: DV-100 item 7 holds 1115 characters and DV-101 item 5, the box that continues it, holds 387. Copying the whole answer would print a clipped one, and a court document that is unreadable at the bottom is worse than one that is split. Nothing is lost and nothing is cut.',
    by: 'overflowSplit() — one function for both readers, because a split computed twice drops a word between the two pages or prints it on both' },

  { id: 'a-condition-lives-in-the-style', group: 'packet', num: 'Rule',
    title: 'A connector’s condition lives in its style',
    says: 'Whatever decides a connector — the option chosen, or the field ticked — is written into the connector cell’s style string, beside connectorTarget.',
    why: 'The editor rebuilds a slot from the canvas, and a property set on the cell does not survive that round trip. Set as _activateWhenTicked the DV-101 rule exported as unconditional: true, which reads as "always file DV-101" — the same class of loss already fixed once for flowchart-level keys. Anything that must survive a rebuild has to live somewhere the rebuild reads.',
    by: 'pipeline-build-packet.js writes it; connector-nodes.js reads either' },

  { id: 'which-forms-are-in-the-packet', group: 'packet', num: 'Rule',
    title: 'One place says which forms are in the packet',
    says: 'Every script that walks the packet asks packet-forms.js, which reads dv-packet.spec.json. No script keeps its own list.',
    why: 'Four of them did, and every one went stale silently. pipeline-fill.js had three of five written out, so DV-101 and DV-105 were switched on by a run and never filled or rendered. pipeline-connect.js had five of six and skipped DV-108’s names entirely. pipeline-sanitize.js rebuilt three of six by default, so a field-config edit to either of the others was not live in the PDF being filled. pipeline-capacity.js matched filenames against /^dv\d+\.pdf$/, which is not a list at all until a form is called CLETS-001. In each case the run looked exactly like a clean one with fewer pages.',
    by: 'packet-forms.js — packetForms(), from the spec' },

  { id: 'an-order-is-the-courts-except-its-identifying-items', group: 'packet', num: 'Rule',
    title: 'A court order is the court’s, except the items that identify the case',
    says: 'On a form that says This is a Court Order, the filer completes only the identifying items and every other field is marked courtUse. Those items carry the names of the questions that already ask them, so the form is filled from what the packet knows and asks nothing new.',
    why: 'DV-140 is 221 fields and 195 of them are the judge’s. Of the 25 that are not, every one - the two names, the two relationships to the children, the children themselves - is a question DV-100 or DV-105 already asks. Given DV-105’s names it asks nothing at all, which is right: a filer should not answer the same question twice because two forms print it.',
    by: 'dv140-field-config.json; the same split DV-110 and DV-109 use' },

  { id: 'court-use', group: 'packet', num: 'Rule 6',
    title: 'Ask only what the filer completes',
    says: 'Every Judicial Council form prints who completes what. A field marked courtUse never becomes a question and stays blank for the judge or clerk.',
    why: 'Asking a survivor what the judge decided produces an answer they cannot know and a filed order that says the court ruled something it has not. This took the packet from 358 questions to about 145.',
    by: 'courtUse in the field config; pipeline-audit.js counts them separately' },

  { id: 'court-field-not-filer-name', group: 'packet', num: 'Rule',
    title: 'A court field must not share a filer’s name',
    says: 'A courtUse field may not carry a name that a filer field somewhere in the packet also carries. Where it does, the court’s copy is renamed with its own form in front.',
    why: 'DV-110 item 6 is a court finding, and its firearm field was called firearm_item_1_description — the same as the DV-100 box where the filer lists what they believe. The filer’s claim was posted straight into the judge’s finding. Nine fields.',
    by: 'pipeline-connect.js — exits non-zero from --check while any remain' },

  { id: 'shared-name-is-the-wiring', group: 'packet', num: 'Rule',
    title: 'A shared field name is the wiring',
    says: 'One answer fills every form that prints it, by giving those fields the same canonical name. The connections file records which are the same answer.',
    why: 'Without it the interview asks three times and a survivor retypes their abuser’s name on every form.',
    by: 'dv-packet-connections.json; pipeline-connect.js' },

  { id: 'one-group-per-form', group: 'packet', num: 'Rule 5',
    title: 'One group per form, named after the form',
    says: 'Exactly one group per form, named after it, holding the sections that carry a question.',
    why: 'The progress bar counts forms rather than sections.',
    by: 'pipeline-audit.js — RULE 5' },

  { id: 'silent-form-still-ships', group: 'packet', num: 'Rule 7',
    title: 'A form that asks nothing still ships',
    says: 'DV-109 asks the filer nothing of its own, and its PDF must still be produced and offered.',
    why: 'A form with no questions is easy to drop from the output and nobody sees it missing until filing.',
    by: 'pipeline-audit.js — RULE 7' },

  { id: 'sections-follow-the-filer', group: 'packet', num: 'Rule',
    title: 'Sections switch in the order the filer meets them',
    says: 'Section assignment walks every question in interview order, branches included, so a section may open inside a branch.',
    why: 'Assignment used to run along the spine and hand each branch its parent’s section, which emptied "Animals, Property and Support" the moment items 16 to 28 moved under the orders question.',
    by: 'compile-form.js — assignSections; the packet build reports any section dropped for being empty' },

  { id: 'survive-a-rebuild', group: 'packet', num: 'Rule',
    title: 'Anything that must survive a rebuild lives in a source the rebuild reads',
    says: 'If a build regenerates an artifact, nothing hand-added to that artifact survives. Put it in an input.',
    why: 'The first four disqualifier alerts were drawn by hand into the built project. The next rebuild dropped all four and the packet went out with the rules declared and none of them wired — the exact failure the disqualifiers file exists to prevent.',
    by: 'pipeline-build-packet.js wires them from the declaration each time' },

  /* ---------------- the printed page ---------------- */
  { id: 'fill-and-read-back', group: 'page', num: 'Rule 4',
    title: 'Fill the packet and read the PDFs back',
    says: 'Post a captured answer set exactly as the form does, keep the filled PDFs, and check every field the answers reached carries a value. A blank is allowed only when an answer ruled it out, and that has to be shown.',
    why: 'A field whose question exists, whose gates are all open, and which is still empty is a defect, not a branch.',
    by: 'pipeline-fill.js and pipeline-explain.js — DEFECT count must be zero' },

  { id: 'look-at-every-page', group: 'page', num: 'Rule',
    title: 'Look at every page as an image',
    says: 'Render every page of every filled PDF and read the images against the blank form. Not optional, and last.',
    why: 'Every other check reads data. A field can hold exactly the right string and still print in the wrong place — the value lives in the field dictionary and the ink comes from the appearance stream. DV-101 printing an answer through the words "Describe any injuries:" passed every data-level check.',
    by: 'pipeline-fill.js --render, then a page-by-page read' },

  { id: 'every-blank-box-is-accounted-for', group: 'page', num: 'Rule',
    title: 'Every blank checkbox is either the court’s or an option not chosen',
    says: 'The fill reports each form’s checkbox count broken down: how many the court ticks, and how many are an option the run did not choose. A box the court owns that comes back ticked is reported as a defect.',
    why: 'DV-110 comes back with three of eighty-five ticked, which reads as a form that barely filled and is in fact correct - eighty are the judge’s decisions and the other two are the gender options not chosen. A ratio that has to be re-derived by hand every time it is read will eventually be read as a defect, or worse, a real one will be read as this.',
    by: 'pipeline-fill.js — courtOwnedBoxes(), from the courtUse marks in dv-field-configs/' },

  { id: 'publish-the-pages', group: 'page', num: 'Rule',
    title: 'Publish the pages you looked at',
    says: 'Every full pass ends by copying the exact images the audit read into Current Form Output/, one folder per form. The folder is replaced, never merged.',
    why: 'Describing what you saw asks the reader to take your word for it. A leftover page from an older run is worse than no page, because it looks current and is not.',
    by: 'pipeline-current-output.js; form-output-dashboard.html watches the folder' },

  { id: 'know-what-a-box-holds', group: 'page', num: 'Rule',
    title: 'Know what a box holds, and stop there',
    says: 'Every PDF box is measured and the interview is given the limit, as a maxlength on the input. A box with continuation lines is measured across the whole chain.',
    why: 'All 465 text fields declare a fixed font size, so a value wider than its box is drawn and then clipped — the answer is on the page and unreadable, and nothing upstream knows, because the DOM and the payload both have the whole string. A filer stopped at the point of typing can shorten what they meant to say; one truncated afterwards cannot.',
    by: 'pipeline-capacity.js measures; the maximum path fills every measured box to exactly its capacity so the rendered page shows whether it stops cleanly' },

  { id: 'measure-with-the-thing-that-draws', group: 'page', num: 'Rule',
    title: 'Measure a box with the code that draws it',
    says: 'A capacity is found by laying the text out with pdf-lib’s own layoutMultilineText and bisecting for the longest run that stays inside the box — over the lines the form actually ruled, using the exact string the fill will write, marker included.',
    why: 'Four separate attempts to predict that layout were each wrong by about a line, and a line is the whole answer: width ÷ average character ignores that words do not split, so DV-101 item 5 measured 400 and printed about 350; a wrap written by hand fitted 98 characters to a line of DV-100 item 14 where pdf-lib fitted 94; box height ÷ font line height gave DV-101 item 4c nineteen lines against seventeen rules; and a plain prefix of the sample is not the string that gets written, because [end] replaces the last five characters and lengthens the closing word. Close is no use — the point of the number is that the text stops inside the box.',
    by: 'pipeline-capacity.js — charsThatLayOut and fillOfLength; verified by filling every wrapping box to capacity and finding none over and none under' },

  { id: 'fill-with-the-text-that-was-measured', group: 'page', num: 'Rule',
    title: 'Fill with the text the capacity was measured from',
    says: 'pipeline-capacity.js and fillToLength() in the generated runtime share one filler text verbatim, and a box that wraps is filled with it from its first word rather than from a per-field sample value.',
    why: 'A capacity is a promise about some particular text, because these are proportional fonts and no count is right for every string. In a box that wraps, the words before the padding decide where every later line breaks — so measuring against one sample and filling with another gives up the only guarantee the number can offer, and even one leading space moves every break after it. Whether a box wraps is what the measurement says, not what the control looks like: dv101_abuse_1_witnesses is a plain input on the page and two ruled lines on the paper.',
    by: 'the shared FILLER text; the __wraps map inside fieldCapacity, which rides along with the measurement rather than being threaded through five files' },

  { id: 'short-form-when-the-long-one-will-not-fit', group: 'page', num: 'Rule',
    title: 'Where the long form will not fit, the short form goes on the paper',
    says: 'When a measured box cannot hold the answer and the form already keeps a canonical short form of that same answer, the short form is what the PDF gets. An answer that fits is never shortened.',
    why: 'DV-110’s State box holds four characters - it is printed for a postal code - while the question is a dropdown of full state names, because picking California is easier and less error-prone than typing two letters. Neither end is wrong; they just disagree, and the disagreement was being resolved by clipping Wyoming to Wyor on a field the form stars as required for a police database.',
    by: 'shorterFormThatFits() in pdfValueForNamedField, reading the hidden <field>_short the state select already maintains' },

  { id: 'a-derived-mirror-is-not-an-answer', group: 'page', num: 'Rule',
    title: 'A box another control writes is not a question',
    says: 'The debug fill skips fields hidden by an inline style on themselves - the _short, _hidden, _code and _no_code mirrors a dropdown or a phone widget maintains - and refreshes them from their owners after the fill instead.',
    why: 'The fill was writing Test Value over every one of them, so the short form of a state was test text. A question hidden because of an answer is hidden by a class on its container, which the fill already checks; a box hidden on itself was put there by the form for its own use. And a fill sets a select without its inline onchange ever running, so the mirrors need recomputing afterwards the way every other derived field does.',
    by: 'isDerivedMirror() and refreshStateMirrors() in the generated runtime' },

  { id: 'a-rule-is-matched-to-the-run-not-the-last-rule', group: 'page', num: 'Rule',
    title: 'A ruled line is matched to the run, not to the rule above it',
    says: 'The writing lines of a box are the longest run of rules that fit an even progression from one of them, within a quarter of the pitch. Not the longest run of consecutive gaps that match the median.',
    why: 'A form’s rules are evenly spaced to the eye and not to the point: DV-100 item 17b is ruled at 14.1, 11.4 and 13.5, which is one block of four lines and reads as one. Comparing each gap to the median broke the run at the 11.4 and kept two, so a box that holds about 380 characters was measured at 190 and half of it went unused. Comparing each rule to where the run says it should be lets that jitter accumulate and cancel, which is what jitter does.',
    by: 'ruled-lines.js — evenlySpacedRun(); every start is tried, because the first rule inside a widget is not always one of its writing lines' },

  { id: 'a-shape-is-a-shape-in-both-places', group: 'page', num: 'Rule',
    title: 'A field with a shape is known to be one in both places',
    says: 'getSampleFillValue() and hasValidatedShape() agree about which fields have a shape. A field the first gives a shaped value to is a field the second refuses to pad.',
    why: 'They had drifted: the sampler produced 123-45-6789 for a Social Security number and the shape test had never heard of one, so the first SSN box in the packet - CLETS-001 item 1 - printed 123-45[end]. A padded SSN is not a longer SSN, it is a wrong one, on a form that goes into a police database. The pair exist to ask the same question, so they have to answer it the same way.',
    by: 'hasValidatedShape() in the generated runtime, which now knows ssn, social and ein' },

  { id: 'a-narrow-box-still-gets-a-limit', group: 'page', num: 'Rule',
    title: 'A box too narrow for a word still gets a limit',
    says: 'When no whole word fits on a line, the line is measured in characters instead. No text box is left unmeasured.',
    why: 'Fitting whole words returned zero for DV-110’s State box, zero was read as "not measured", and the field was left with no cap at all — so Wyoming printed as Wyor with nothing to say so. The narrowest box is the one that most needs the limit.',
    by: 'pipeline-capacity.js — charsThatFit; the State box holds four characters, which is a fact about the paper that the dropdown of full state names still has to answer' },

  { id: 'validated-shapes-are-not-padded', group: 'page', num: 'Rule',
    title: 'A field whose content has a shape is never padded',
    says: 'A ZIP, a date, a phone, a percentage or an age is filled with a real value of that shape and neither capped-to-fill nor marker-filled.',
    why: 'A ZIP padded to eleven characters is not a longer ZIP, it is a wrong one, and the page would be testing the wrong thing. Both the marker fill and the capacity padding ask the same question, so the test lives once and they cannot drift.',
    by: 'hasValidatedShape() in the generated runtime, used by getSampleFillValue and padToCapacity' },

  { id: 'text-sits-on-the-ruled-lines', group: 'page', num: 'Rule',
    title: 'Multi-line text is laid on the lines the form ruled',
    says: 'The rules are read out of the page’s content stream and each baseline is put 1.6pt above one of them. Only the evenly spaced run of rules inside a box counts, and a rule on the box’s bottom edge counts.',
    why: 'Dividing the box height by the lines it holds is close, and close compounds: DV-101 item 5 is 60.4pt over four lines, which gives 15.1pt against a real 14.0, so the first line cleared its rule and the fourth was struck through. The two filters are earned as well — a widget’s rectangle is not drawn to the ruled area, so DV-101 item 3d covered the label rule of item 3e below it and printed one sentence over another, and DV-105 item 5b is drawn so its last rule is the box’s bottom edge, which a one-point margin threw away.',
    by: 'ruled-lines.js parses the content stream; dev-server.js harvests once per fill and lays the baselines. Where the rules cannot be read the old estimate still runs' },

  { id: 'a-line-with-nowhere-to-go-says-so', group: 'page', num: 'Rule',
    title: 'A line that will not print says so',
    says: 'When a value lays out into more lines than the box has rules, the fill logs the field, the lines it needs and the lines it has. A clean run logs none.',
    why: 'Text laid out past the last rule is written below the box and clipped. The value is complete in the AcroForm, the payload is complete, and only the ink is short — so every check that reads data passes and the paper is wrong. Whoever is filling the packet deserves to be told which box it was.',
    by: 'dev-server.js — ruledPitchAppearance; six boxes were dropping a line before the measurement was fixed, and none are now' },

  { id: 'long-answer-next-line', group: 'page', num: 'Rule',
    title: 'A long answer runs onto the next ruled line',
    says: 'When an answer is wider than its line, the remainder wraps onto the ruled lines beneath it. The continuation is found by geometry, not by field names.',
    why: 'DV-100 item 16b(3) has 166pt of line and the answer wanted 226pt, so it was drawn and clipped while the second ruled line the form printed for exactly this sat empty.',
    by: 'dev-server.js — spillOntoContinuationLines, which logs every spill' },

  { id: 'box-must-not-cover-its-label', group: 'page', num: 'Rule',
    title: 'A field box must not cover the form’s own label',
    says: 'A multi-line field whose rectangle covers text the page already printed has its top lowered when the PDF is sanitized.',
    why: 'DV-101 item 3e starts eight points above the label it belongs to, so the answer printed straight through the words "Describe any injuries:". Only the page image finds it.',
    by: 'pipeline-sanitize.js — reports every box it lowers' },

  { id: 'buttons-keep-their-words', group: 'page', num: 'Rule',
    title: 'A button that was printing words keeps them',
    says: 'A push button with no background colour is text the page needs; its caption is drawn as ink before the widget is dropped. One with a background colour is a control and goes.',
    why: 'DV-100 page 13 lists the forms you must file, and each form number was a push button. Deleting them printed "Form , Temporary Restraining Order" — a survivor told to file a form the page no longer names.',
    by: 'pipeline-sanitize.js — reports every caption it draws' },

  { id: 'one-line-box-is-one-line', group: 'page', num: 'Rule',
    title: 'A box one line tall is laid out as one line',
    says: 'A field carrying the multiline flag in a box shorter than one line of multiline text borrows the single-line layout, which fits.',
    why: 'pdf-lib needs 12.21pt at 11pt Helvetica, the box gives 12.00pt, and the glyphs are clipped through the middle.',
    by: 'dev-server.js — ruledLineTextAppearance' },

  /* ---------------- working on it ---------------- */
  { id: 'the-paper-is-on-screen', group: 'process',
    title: 'The paper is on screen beside the flowchart',
    says: 'The Default PDF Properties panel renders the form it names, page by page, with a View Fullscreen button. Selecting a node lights up the box on the paper that node fills, jumping to the page that box is on and naming the field in full.',
    why: 'A question in the editor is a rectangle with a name on it, and the thing that name refers to is a box on a court form the author cannot see. Whether this is the question that prints in item 7, whether the box is a line or a paragraph, whether two questions point at the same box - all of it was knowable only by opening the PDF separately and hunting for the field by eye. A name that matches nothing on the PDF says so in red, which is the cheapest possible check that a node is wired to something real.',
    by: 'pdf-preview.js — rendered to a canvas, not an iframe, because the highlight needs the widget rectangles drawn over the page' },

  { id: 'no-redraw-can-cause-its-own-redraw', group: 'process',
    title: 'Nothing that resizes may be watched for resizing',
    says: 'The preview measures its width from the panel around it and redraws on window resize, never on a ResizeObserver watching the box the canvas is in.',
    why: 'The canvas is what makes the box tall enough to need a scrollbar, and the scrollbar is what makes the box narrower - so a redraw sized to the box changed the width the next redraw would use. It ran forever and took the editor’s main thread with it. A redraw that can be caused by its own last redraw is a loop looking for somewhere to happen.',
    by: 'pdf-preview.js — fitWidth() reads the panel; the window is the only thing here whose size is not an effect of the drawing' },

  { id: 'nothing-renders-to-a-hidden-tab', group: 'process',
    title: 'Nothing renders to a tab nobody is looking at',
    says: 'The preview defers drawing while document.hidden, and draws what it deferred on visibilitychange. The highlight is still positioned, because the viewport is computed before the render.',
    why: 'pdf.js drives a canvas render from requestAnimationFrame, and a hidden tab is served no frames - so the render starts, paints part of the page, and never finishes or settles its promise. Left to run, that is a task that never clears and a preview stuck half-drawn from the moment the editor is opened in a background tab.',
    by: 'pdf-preview.js — the document.hidden check in draw(), and the visibilitychange listener' },

  { id: 'read-the-interview', group: 'process', num: 'Rule',
    title: 'Read the whole interview before shipping',
    says: 'Print the interview in the order a person meets it, read all of it, then answer the form in the preview and check that saying No to a gate really does remove the block behind it.',
    why: 'The audit is a regression test for defects that already happened once. It reported zero failures on a packet that asked thirty questions about further abuse of a filer who had just said it happened once.',
    by: 'pipeline-review.js — required, not a review of last resort' },

  { id: 'wait-for-the-builder', group: 'process', num: 'Rule',
    title: 'Wait for the builder before reading it back',
    says: 'loadFormData restores hidden logic on per-question timers. Give it time and check the count before calling getFormHTML.',
    why: 'Read too early and the page is emitted with no hidden logic, so every exclusive choice falls back to a label-derived checkbox name that matches no PDF field. The interview looks right, the payload looks full, the audit passes, and the printed boxes are empty — fifteen groups on DV-100 alone.',
    by: 'count .hidden-logic-config in the builder, and grep the emitted HTML for a non-empty hiddenLogicConfigs' },

  { id: 'restart-the-server-in-place', group: 'process', num: 'Rule',
    title: 'Restart the dev server in place',
    says: 'When dev-server.js changes, kill the process on 8080 and start it again on 8080. Never a second port.',
    why: 'A second port means the browser tab, the preview and every pipeline default keep talking to the stale server, so what you see is not what just changed.',
    by: 'convention' },

  { id: 'prefer-geometry', group: 'process', num: 'Rule',
    title: 'Prefer geometry to names',
    says: 'Where a PDF’s own names carry no meaning, decide from the rectangles: which label belongs to which box, which line continues which, which button is a control.',
    why: 'Judicial Council field names are laid down by the authoring tool. Guessing which "tf" is Start is how a form prints the end time in the start column, and nothing downstream catches it.',
    by: 'pipeline-field-labels.js and the geometry tests in the sanitizer and filler' },

  { id: 'no-hard-coding', group: 'process', num: 'Rule',
    title: 'Every rule is general, never written for one form',
    says: 'New behaviour is driven by declarations and by what can be measured, not by a list of field names for the form in front of you.',
    why: 'The packet is going to keep growing. A fix that names DV-100 fields is a fix that has to be written again for the next form.',
    by: 'review; every rule here states the signal it keys on' },
];

const byId = Object.fromEntries(GROUPS.map((g) => [g.id, g]));
const slug = (id) => 'rule-' + id;

function render(filter) {
  const main = document.getElementById('main');
  const toc = document.getElementById('toc');
  main.textContent = ''; toc.textContent = '';
  const needle = (filter || '').trim().toLowerCase();
  let shown = 0;

  GROUPS.forEach((group) => {
    const rules = RULES.filter((r) => r.group === group.id).filter((r) =>
      !needle || (r.title + ' ' + r.says + ' ' + r.why + ' ' + r.by + ' ' + r.num)
        .toLowerCase().includes(needle));
    if (!rules.length) return;
    shown += rules.length;

    const head = document.createElement('div');
    head.className = 'group-head';
    head.innerHTML = '<h2></h2><p></p>';
    head.querySelector('h2').textContent = group.name;
    head.querySelector('p').textContent = group.blurb;
    main.appendChild(head);

    const tocHead = document.createElement('h3');
    tocHead.textContent = group.name;
    toc.appendChild(tocHead);

    rules.forEach((rule) => {
      const link = document.createElement('a');
      link.href = '#' + slug(rule.id);
      link.textContent = rule.title;
      toc.appendChild(link);

      const art = document.createElement('article');
      art.id = slug(rule.id);
      art.style.setProperty('--tag', group.tag);

      const h = document.createElement('div');
      h.className = 'rule-head';
      const num = document.createElement('span');
      num.className = 'num'; num.textContent = rule.num;
      const title = document.createElement('h4'); title.textContent = rule.title;
      const copy = document.createElement('button');
      copy.className = 'copy'; copy.textContent = 'Copy link';
      copy.addEventListener('click', () => {
        const url = location.origin + location.pathname + '#' + slug(rule.id);
        navigator.clipboard.writeText(url).then(
          () => { copy.textContent = 'Copied'; setTimeout(() => copy.textContent = 'Copy link', 1400); },
          () => { copy.textContent = url; }
        );
      });
      h.append(num, title, copy);

      const says = document.createElement('p'); says.className = 'says'; says.textContent = rule.says;
      const why = document.createElement('p'); why.className = 'why';
      why.innerHTML = '<b>Why:</b> '; why.append(document.createTextNode(rule.why));
      const by = document.createElement('p'); by.className = 'by';
      by.innerHTML = '<b>Checked by:</b> '; by.append(document.createTextNode(rule.by));

      art.append(h, says, why, by);
      main.appendChild(art);
    });
  });

  if (!shown) main.appendChild(Object.assign(document.createElement('p'),
    { className: 'none', textContent: 'No rule matches that.' }));
  document.getElementById('count').textContent =
    shown + (needle ? ' of ' + RULES.length : '') + ' rules';
}

/**
 * Take the reader to the rule the link names and make it obvious which one it is.
 *
 * :target alone is not enough - it survives only until the next click anywhere,
 * and a link sent in conversation has to still be pointing at something when
 * the reader looks up from scrolling.
 */
function lightUp() {
  const id = decodeURIComponent(location.hash.slice(1));
  if (!id) return;
  const el = document.getElementById(id);
  if (!el) return;
  document.querySelectorAll('article.lit').forEach((a) => a.classList.remove('lit'));
  el.classList.add('lit');
  el.scrollIntoView({ behavior: 'smooth', block: 'start' });
  setTimeout(() => el.scrollIntoView({ block: 'start' }), 500);
}

document.getElementById('q').addEventListener('input', (e) => {
  render(e.target.value);
  if (!e.target.value) lightUp();
});
window.addEventListener('hashchange', lightUp);

render('');
lightUp();
</script>
