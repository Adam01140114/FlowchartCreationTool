<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Form Pipeline Rules</title>
<style>
  :root {
    --ink: #16191d; --muted: #6b7785; --line: #e4e8ee; --paper: #fff;
    --ground: #f4f6f9; --accent: #2f6fed; --mark: #fff3c4; --markline: #e8b93b;
    --tag-interview: #2f6fed; --tag-packet: #7a4fd6; --tag-page: #17845a; --tag-process: #b8632a;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ink: #e8ecf1; --muted: #98a3b3; --line: #2a3038; --paper: #1b1f25;
      --ground: #111418; --accent: #6f9dff; --mark: #3a3114; --markline: #b9922c;
      --tag-interview: #6f9dff; --tag-packet: #b18aff; --tag-page: #46c391; --tag-process: #e0975a;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--ground); color: var(--ink);
    font: 15px/1.62 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  header {
    position: sticky; top: 0; z-index: 30; background: var(--paper);
    border-bottom: 1px solid var(--line); padding: 13px 24px;
    display: flex; gap: 14px; align-items: center; flex-wrap: wrap;
  }
  h1 { margin: 0; font-size: 17px; font-weight: 650; letter-spacing: -0.01em; }
  .sub { color: var(--muted); font-size: 13px; }
  .spacer { margin-left: auto; }
  .btn {
    text-decoration: none; font-size: 13px; font-weight: 600; color: var(--ink);
    border: 1px solid var(--line); border-radius: 8px; padding: 6px 13px; background: transparent;
    cursor: pointer; font-family: inherit; display: inline-flex; align-items: center; gap: 6px;
  }
  .btn:hover { border-color: var(--accent); color: var(--accent); }
  .btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  .btn.primary:hover { filter: brightness(1.08); color: #fff; }
  #q {
    font: inherit; font-size: 13px; padding: 6px 11px; border-radius: 8px;
    border: 1px solid var(--line); background: var(--ground); color: var(--ink); width: 210px;
  }
  .wrap { display: flex; gap: 28px; max-width: 1280px; margin: 0 auto; padding: 26px 24px 80px; }
  aside {
    width: 250px; flex: none; position: sticky; top: 74px; align-self: flex-start;
    max-height: calc(100vh - 100px); overflow-y: auto;
  }
  aside h3 {
    margin: 16px 0 6px; font-size: 11px; letter-spacing: .08em; text-transform: uppercase;
    color: var(--muted); font-weight: 700;
  }
  aside h3:first-child { margin-top: 0; }
  aside a {
    display: block; text-decoration: none; color: var(--muted); font-size: 13px;
    padding: 3px 8px; border-radius: 6px; border-left: 2px solid transparent;
  }
  aside a:hover { color: var(--accent); background: var(--paper); }
  main { flex: 1; min-width: 0; }
  .group-head {
    margin: 34px 0 14px; padding-bottom: 7px; border-bottom: 1px solid var(--line);
    display: flex; align-items: baseline; gap: 10px;
  }
  .group-head:first-child { margin-top: 0; }
  .group-head h2 { margin: 0; font-size: 15px; font-weight: 650; }
  .group-head p { margin: 0; color: var(--muted); font-size: 13px; }
  article {
    background: var(--paper); border: 1px solid var(--line); border-radius: 11px;
    padding: 18px 20px; margin-bottom: 14px; scroll-margin-top: 84px;
    transition: box-shadow .2s ease, border-color .2s ease, background .2s ease;
  }
  article:target, article.lit {
    border-color: var(--markline); background: var(--mark);
    box-shadow: 0 0 0 4px rgba(232, 185, 59, .22);
  }
  .rule-head { display: flex; align-items: baseline; gap: 9px; flex-wrap: wrap; }
  .num {
    font-size: 11px; font-weight: 750; letter-spacing: .05em; color: #fff;
    background: var(--tag); border-radius: 5px; padding: 2px 7px; white-space: nowrap;
  }
  .rule-head h4 { margin: 0; font-size: 15px; font-weight: 650; flex: 1; min-width: 200px; }
  .copy {
    border: 1px solid var(--line); background: transparent; color: var(--muted);
    border-radius: 6px; font: inherit; font-size: 11px; padding: 2px 8px; cursor: pointer;
  }
  .copy:hover { color: var(--accent); border-color: var(--accent); }
  /* The rule every other interview rule rests on: it may not read like one of many. */
  article.cornerstone { border: 2px solid #c2410c; box-shadow: 0 0 0 4px rgba(194, 65, 12, .12); }
  article.cornerstone .says { font-weight: 560; }
  .cornerstone-tag {
    font-size: 11px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase;
    color: #fff; background: #c2410c; border-radius: 5px; padding: 2px 7px; white-space: nowrap;
  }
  .says { margin: 10px 0 0; }
  .why, .by { margin: 9px 0 0; font-size: 13.5px; color: var(--muted); }
  .why b, .by b { color: var(--ink); font-weight: 650; }
  code {
    font: 12.5px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    background: var(--ground); border: 1px solid var(--line); border-radius: 4px; padding: 1px 5px;
  }
  .none { color: var(--muted); padding: 30px 0; }
  @media (max-width: 900px) { aside { display: none; } .wrap { padding: 20px 16px 60px; } }
</style>
</head>
<body>
<header>
  <h1>Form Pipeline Rules</h1>
  <span class="sub" id="count"></span>
  <span class="spacer"></span>
  <input id="q" type="search" placeholder="Filter rules…" autocomplete="off">
  <a class="btn primary" href="form-output-dashboard.html">🖼️ Page images →</a>
</header>

<div class="wrap">
  <aside id="toc"></aside>
  <main id="main"></main>
</div>

<script>
/*
 * Every rule this pipeline enforces, in one place, each one addressable.
 *
 * The point of the anchors is conversational: "what rule is this?" should be
 * answerable with a link that opens here, scrolls to the rule and lights it up,
 * rather than with a paragraph that has to be trusted. So each rule has a
 * stable id that never changes once published - renaming one would break every
 * link already sent - and the Copy link button hands you that address.
 *
 * Each entry says three separate things, and they are not interchangeable:
 * what the rule requires, the specific failure that caused it to be written,
 * and what actually checks it. A rule with no checker is a preference.
 */
const GROUPS = [
  { id: 'interview', name: 'The interview', tag: 'var(--tag-interview)',
    blurb: 'What gets asked, and how.' },
  { id: 'packet', name: 'The packet', tag: 'var(--tag-packet)',
    blurb: 'Several forms behaving as one.' },
  { id: 'page', name: 'The printed page', tag: 'var(--tag-page)',
    blurb: 'What the filer actually hands in.' },
  { id: 'process', name: 'Working on it', tag: 'var(--tag-process)',
    blurb: 'How a change gets made and checked.' },
];

const RULES = [
  /* ---------------- the interview ---------------- */
  { id: 'a-question-never-carries-its-condition', group: 'interview', num: 'Rule 2', cornerstone: true,
    title: 'A question never carries its condition: the condition is a gate',
    says: 'Every other interview rule rests on this one. When a question only applies in some situations, the situation is asked first, as a Yes/No question of its own, and the question is shown only on Yes. The words of a title, a box label or a choice never hold the condition: no "If there is…, what is…?", no "…, if you know", no "if any", no "if it applies", no "If someone else, …". "If there is another parent or legal guardian besides you and the other person, what is their name?" is two questions: "Is there another parent or legal guardian besides you and the other person?" and, only on Yes, "What is their name?". A condition an earlier choice already answers is that question’s condition, not part of its words. Something the filer may simply not know is marked optional ("optional": true), and the Next button lets them past it; the title never says so (Rule 15).',
    why: 'A condition in the wording makes every filer read, work out and dismiss a question that is not about them, and the form asks it anyway. DV-105 asked "If there is another parent or legal guardian besides you and the other person, what is their name?" of everyone after this rule was written, because the check meant to catch it was silently broken: its pattern held literal backspace characters where \\b belonged, matched nothing, and printed "passes". A rule whose checker cannot fail is not enforced, so the patterns now test themselves.',
    by: 'wording-rules.js (node wording-rules.js runs its self-test), read by compile-form.js, which refuses to write a flowchart whose wording carries a condition, and by pipeline-audit.js RULE 2 (CORNERSTONE), which fails the run. A gate is written as conditional: { onlyWhen, gateQuestion } in the hints' },

  { id: 'every-title-is-a-full-sentence', group: 'interview', num: 'Rule 14',
    title: 'Every question title is a full sentence',
    says: 'A question title reads on its own as a complete sentence ending in a question mark or a full stop. It never leans on the question before it ("And before that?", "And somewhere else before that?"), is never a fragment ("Which county?", "Which children?", "Your lawyer’s information"), never opens with a label and a colon ("Monday: what should the visit look like?") and never ends in a colon ("They must have written permission or a court order to take the children outside:"). Name what is asked about: "Where did the children live before the address you just gave?", "Which county should the children not be taken out of?", "What should the visit on Monday look like?". A title never says "(optional)" (Rule 15); the "(check all that apply)" the form adds to a checklist is not part of the title.',
    why: 'The one-question-at-a-time mode shows a title and nothing else, so "And before that?" means nothing on its screen. Titles lifted from the paper were captions for a box with its heading printed above it; the interview has no heading above it.',
    by: 'wording-rules.js; pipeline-audit.js RULE 14, which fails the run' },

  { id: 'optional-is-coded-not-said', group: 'interview', num: 'Rule 15',
    title: 'Optional is coded, never said',
    says: 'A question the filer may skip is marked optional — "optional": true on the question hint, the combine or the part — and that is the whole of it: the editor exports it as required: false, the form tags it data-optional, and the Next button lets the filer past it blank. Its title never says "(optional)", and neither does a box label in the hints. An optional box inside a required question is the one place the form shows it, in the box itself, because there the question cannot be skipped and the box can.',
    why: '"How can the court reach you? (optional)" said it and was required all the same: nothing had marked it, so the word was a promise the form did not keep, and a filer who believed it was stopped at Next. A word in a title is not a setting.',
    by: 'wording-rules.js (saysOptional); pipeline-audit.js RULE 15, which fails the run and says whether the question was really marked; compile-form.js refuses to write a flowchart whose title says it' },

  { id: 'every-field-reachable', group: 'interview', num: 'Rule 1',
    title: 'Every PDF field is reachable',
    says: 'Every fillable field on the PDF must be reachable from something the form posts. A field nothing can fill is a blank on a filed document.',
    why: 'Exceptions are declared, not assumed: a court field, an overflow line, or a computed field is exempt and says so by name in the audit output.',
    by: 'pipeline-audit.js — RULE 1' },

  { id: 'no-field-names-on-screen', group: 'interview', num: 'Rule 2',
    title: 'Nothing a person reads is a field name',
    says: 'No question text, option label or placeholder may be a raw PDF field name. Wording is authored in the hints, not derived from the schema.',
    why: 'The audit once passed a packet that asked "Do you have a dV 100[0].Page4[0]...?" — which is why reading the interview is a required step and not a formality.',
    by: 'pipeline-audit.js — RULE 2, plus pipeline-review.js and a human read' },

  { id: 'repeats-are-blocks', group: 'interview', num: 'Rule 3',
    title: 'Repeated entries use a block, not flat questions',
    says: 'A numbered family of PDF fields becomes one "how many?" block whose entries carry {n}, never a run of near-identical questions.',
    why: 'Six firearms asked as eighteen questions is eighteen screens for one table.',
    by: 'pipeline-audit.js — RULE 3; the repeats hint' },

  { id: 'gated-block-starts-at-one', group: 'interview', num: 'Rule',
    title: 'A repeating block behind a gate starts at one entry',
    says: 'If a block is only reached by answering something, its minimum is one. A block on the spine keeps whatever the hint says, because there zero can be a real answer.',
    why: '"Does the person have firearms? Yes" was followed by a spinner starting at zero — offering a filer who just said yes the answer none, and a form that contradicts itself two questions apart.',
    by: 'compile-form.js — raiseMinimumForGatedBlock, which prints every block it raises' },

  { id: 'an-order-owns-its-questions', group: 'interview', num: 'Rule',
    title: 'An order owns its questions',
    says: 'When a form asks which orders you want and then asks about each one, those follow-ups gate on the option that asks for it — the whole run, not just its first question.',
    why: 'Gating only the entry moved each block and left its tail on the spine, so "Why do you have the right to live there?" was still asked of a filer who never asked anyone to move out.',
    by: 'the conditional hints; visible in pipeline-review.js as what each question waits on' },

  { id: 'computed-not-guessed', group: 'interview', num: 'Rule',
    title: 'A field the filer cannot know is computed, not asked',
    says: 'If the packet can work a value out, it does. Declaring a field computed generates no question and the form fills it when it posts.',
    why: 'DV-100 item 32 asks how many extra pages are attached. Asked as a question it gets a guess — the debug fill answered 100 — and a wrong number on a filed court document is worse than a blank one.',
    by: 'the computed hint; pipeline-audit.js lists them as exempt from Rule 1' },

  { id: 'one-question-one-thing', group: 'interview', num: 'Rule 8',
    title: 'One question asks one thing',
    says: 'A PDF box holding two answers is asked as two boxes and rejoined on the way out, even when the paper prints one line for both and even inside a question of several boxes. A city and a state are two boxes; a driver’s license number and the state that issued it are two; an employer’s name and address are two. Each box in a multi-part question is one thing, and a one-box question whose title is two questions is two questions: "Where and in what year was it filed, and what is its case number?" is three boxes.',
    why: 'A single box wanting a name and a date gets one of them. DV-105 item 4 asked "City and state" in one box six times, inside combined questions this check never looked into: it read whole questions only. Later DV-105 asked where, when and which case number in one box for six kinds of case; the wording check put it on a list for a person to read, and nobody did.',
    by: 'pipeline-audit.js — RULE 8, which reads every box inside a question by field name and by label, and a one-box question’s title for two question words (twoQuestionsInOneBox in wording-rules.js), and fails the run; the splits hint, whose parts a combine can name' },

  { id: 'one-subject-one-question', group: 'interview', num: 'Rule 9',
    title: 'Questions about one subject are one question',
    says: 'Whenever the form asks several things about one subject, it asks them as one multiple-textbox question. A person\'s name, age, date of birth, gender and race is one question with five parts; an address is one question with four boxes. Dates, numbers, phone numbers and a choice such as gender go inside it too, each drawn the same size as the text boxes. A choice that opens other questions stays a question of its own. A part the filer may not know is optional and says so.',
    why: 'DV-100 asked "Who do you want protection from?", "About how old are they?", "What is their date of birth?", "What is their gender?" and "What is their race?" — five screens for one person.',
    by: 'pipeline-audit.js — RULE 9; the combines hint, where a part names a field or a group' },

  { id: 'ask-in-the-right-type', group: 'interview', num: 'Rule 10',
    title: 'Ask for a value in the type it is',
    says: 'Dates get a date picker, phones a keypad, money a number box. What a box holds is read from what it says as well as from what it is called: a label or a PDF caption saying date, since, from, until or (month/year) is a date. A date the PDF box cannot print whole prints in the short form the box asks for: a "(month/year)" box gets 03/2020, or 03/20 when only five characters fit.',
    why: 'A date typed free-hand arrives in a format the PDF was not expecting. DV-105 item 4 asked "Living there since (month/year)", "From" and "Until" as plain text: the check only looked for field names ending in _date, and these were named _from and _until.',
    by: 'pipeline-audit.js — RULE 10, by field name, by label and by the PDF caption, and it fails the run; questions[...].type and a combine part’s type' },

  { id: 'say-what-to-enter', group: 'interview', num: 'Rule 11',
    title: 'A question says what to enter',
    says: 'The wording tells the filer what belongs in the box.',
    why: 'A label lifted from a field name tells them nothing.',
    by: 'pipeline-audit.js — RULE 11' },

  { id: 'narrative-asked-as-narrative', group: 'interview', num: 'Rule 12',
    title: 'A narrative box is asked as a narrative',
    says: 'A multi-line PDF box is asked with a multi-line question - and so is a multi-line box inside a block or a multi-part question: its entry field is typed bigParagraph and drawn as a textarea.',
    why: 'A one-line question under a ten-line box invites an answer that will not fit. DV-160\'s redaction columns and FL-150\'s insurance company address were asked on one line for as long as the rule was only a printed note; a block\'s field could not be anything but a one-line input.',
    by: 'pipeline-audit.js — RULE 12, which blocks the build; bigParagraph passes through library.js (FIELD_TYPE_PASSTHROUGH) and generate.js draws the textarea' },

  { id: 'a-gate-must-gate', group: 'interview', num: 'Rule',
    title: 'A gate that shows its follow-up on both answers is not a gate',
    says: 'A follow-up shown on Yes and on No must either be fixed or declared always-shown with a written reason.',
    why: 'It reads as a gate and gates nothing, so nobody notices the block it was supposed to control is always on.',
    by: 'pipeline-audit.js — the gates check; the alwaysShown hint carries the reason' },

  { id: 'no-means-no', group: 'interview', num: 'Rule',
    title: 'A question about what Yes opens is never asked after No',
    says: 'When a question opens a subject - "Do you want the order to protect other people?" - every question about that subject waits on the Yes. One that is also reached after No is a missing condition, not a shared question.',
    why: 'DV-100 asked "Why do these people need protection?" of a filer who had just said the order protects nobody else. It sat where the branch rejoined, with no condition at all, and the gates check only read the conditions questions had.',
    by: 'pipeline-audit.js — the gates check, "asked after its No"' },

  { id: 'optional-is-skippable', group: 'interview', num: 'Rule',
    title: 'A question marked optional can be skipped',
    says: '"optional": true on a question hint, on a combine, or on one part of a combine lets the filer past it without an answer, and the question after it waits on what it waited on, not on its answer. An optional part inside a required question says so in its box; the title of an optional question never does (Rule 15).',
    why: 'The hints marked the CLETS-001 details and DV-110\'s description optional and nothing read the flag: "What is their Social Security number, if you know it?" could not be left blank.',
    by: 'compile-form.js carries it as _optional; the editor exports required: false; the form skips it when it checks for answers' },

  { id: 'back-retraces-next', group: 'interview', num: 'Rule',
    title: 'Back goes back the way the filer came',
    says: 'Back returns to the section the filer just left, never to a section of a form their answers have switched off or a section whose questions have all closed. Pressing Next to the last section and Back to the first visits the same sections in reverse.',
    why: 'Back took the nearest earlier section with a question on it. A filer who asked only for an order not to abuse them went from "Orders You Want" to CLETS-001, pressed Back, and landed in DV-108 "Risk of Abduction" - a form that was not in their packet, holding a required question. Every audit read data and none pressed a button, so nothing caught it.',
    by: 'pipeline-nav-audit.js (headless Chrome fills the published site on the minimum and maximum paths, walks Next then Back, exits 1 when they differ); pipeline-audit.js JUMPS (a jump to a section that does not exist finishes the form early); generate.js - sectionReachable, findPrevSectionWithVisibleQuestions, goBack' },

  { id: 'fill-buttons-are-pressed', group: 'interview', num: 'Rule',
    title: 'The fill buttons are tested by pressing them',
    says: 'Fill minimum path and Fill maximum path are audited the way a person uses them: the debug menu open, the button clicked, the clock running - and judged by what the page draws, not what it stores. Each finishes within three seconds; nothing it wrote is gone three seconds later; no section the walk passes shows an empty field on a question it shows, where a value painted transparent or hidden counts as empty; and the page after the button is the page after the worked-out fill, every answer and every element drawn the same way.',
    why: 'The recorded fill passed every check when called from a script with the menu shut - about a second, every answer matching the old fill. Pressed for real it took 45 seconds, because the open menu rebuilt its list of every field on each input event, and the page emptied the restraining orders\' dates while the fill waited. Then, with that fixed, the dates were still blank on screen: every one held its value, and 46 date boxes showed their captions over it, because a date box is marked as holding a date only by an event and the button writes without them. The audit read values; the filer reads the screen.',
    by: 'pipeline-nav-audit.js (clicks the button with the menu open; --fill-budget, 3000 ms; answers gone after 3 s; empty fields as drawn on every section walked; every answer and every element\'s classes against the worked-out fill in a tab of its own; the same again on a page that restored a saved draft, 8 s on); generate.js - the input listener skips a fill; applyBakedFill holds the recorded answers until the page is quiet and syncs what the page draws from them (fwSyncDateFields)' },

  { id: 'a-restore-never-lands-over-a-fill', group: 'interview', num: 'Rule',
    title: 'A saved draft is never restored over a fill',
    says: 'The page restores a saved draft on timers after it loads. Every step of that restore - the passes, the replay of the answers, the rebuilding of the blocks they open - stops once a debug fill has run, and a fill that starts mid-replay stops the replay.',
    why: 'On a returning filer\'s page the restore\'s deferred replay landed a second after Fill maximum path and rebuilt every repeating block empty: 180 fields - the restraining orders, the protected people, the children, the animals, debts and expenses - one load in two. The fill had finished and checked itself clean. Every audit started with empty storage, so none of them ever ran a restore.',
    by: 'generate.js - replayRestoredAnswers and each deferred restore callback return once window.__fwDebugFillRan is set; pipeline-nav-audit.js loads every page again with a saved draft (the other path\'s answers) and fails when anything the fill wrote is gone 8 s later' },

  { id: 'each-page-its-own-recording', group: 'interview', num: 'Rule',
    title: 'Each page has its own recorded fill paths',
    says: 'The minimum and maximum paths are recorded for every way of asking - the section page and the question-at-a-time page - because the pages do not start with the same questions on screen, and a page uses only a recording made on its own form logic. Pages whose logic is identical share one recording.',
    why: 'Only the section page was recorded. The question page\'s logic differs from it in one display flag (alwaysVisibleStacked), so it rejected the recording and worked the path out every time: 10.7 s for the minimum path against a budget of 3.',
    by: 'live-site-builder.js records per page (fillPaths.byMode); generate.js gives each page its own; pipeline-nav-audit.js --modes question holds the question page to the same budget' },

  { id: 'check-all-that-apply-is-asked-that-way', group: 'interview', num: 'Rule',
    title: 'Where the paper says check all that apply, the filer can choose more than one',
    says: 'A set of boxes the form marks "check all that apply" is asked as a question that takes several answers - never as a single choice, even where two of its boxes rarely go together.',
    why: 'DV-100 item 24, child support, says check all that apply, and it was asked as a dropdown. A filer on TANF who also wanted a child support order could say only one of the two, and the form went to court with half their answer.',
    by: 'dv100-hints.json child_support_situation ("multiSelect": true); the human read (pipeline-review.js) against the paper' },

  { id: 'room-for-another-is-offered', group: 'interview', num: 'Rule',
    title: 'Room on the paper for another is offered, not required',
    says: 'Where a form has room for a second incident, address or person, the filer is asked whether there is one before being asked about it. Nobody is made to invent a second of something to finish the form.',
    why: 'DV-101 has room for two incidents and asked every filer about the second, as required questions. A filer with one more incident to tell had to make up a date and a description to reach the end.',
    by: 'dv101-hints.json choice dv101_abuse_2_asked gates incident 2; the human read' },

  { id: 'the-packet-makes-every-form-the-paper-asks-for', group: 'packet', num: 'Rule',
    title: 'Every form the paper asks the filer for, the packet makes',
    says: 'Every form the packet\'s paperwork mentions - told to complete it, pointed at it, or listing it - is decided about. It is in the packet, brought in by the answer that calls for it and filled from the interview; or it is the filer\'s and still to build, and every audit run prints it; or it is someone else\'s, and the spec says whose; or it is a guide that is read, never filed. The court\'s own guides to the process are read the same way, so a form the process needs that no packet form mentions is found too. The packet\'s scope is the list of first-filing forms the user set (spec "scope"): the packet makes exactly those, and a form the paper mentions outside that list is declared out of scope, saying why - never built, never sent for.',
    why: 'DV-105 item 4a says "If no, complete form DV-105(A)." The packet had no DV-105(A), and every check passed, because every check read the forms the packet had. The interview answered with a subtitle telling the filer to get DV-105(A) from the court clerk, fill it out and attach it - the job the filer came to this tool to be spared.',
    by: 'pipeline-form-refs.js --check (npm run audit) reads every packet PDF, and every guide in the spec\'s "referenceSources", in reading order, and fails any mentioned form that "forms", "formsStillToBuild", "formsNotInPacket" or "formsToRead" does not account for. Its first strict run found twenty nobody had decided about. DV-105(A) is in the packet, twice: a second copy is made from the same blank (spec "blank"). How to download a blank yourself: Hand Off/NEW-FORM.md section 0. The same check fails a packet form outside "scope", or a scope form nothing makes; "formsOutOfScope" accounts for the rest - SER-001, DV-200, INT-300, MC-410 and RA-010 left the packet on September 14, 2026, when the user limited it to the first-filing forms' },

  { id: 'the-interview-never-sends-the-filer-for-a-form', group: 'packet', num: 'Rule',
    title: 'The interview never sends the filer for a form',
    says: 'Nothing the filer reads - a question, a subtitle, a box label, a choice, an alert - tells them to get, download, fill in or attach a form themselves. The filer answers questions; the packet hands back finished paperwork.',
    why: 'Under "Have all the children lived together for the last five years?" DV-105 said: "This packet does not include it: get it from your court clerk or at courts.ca.gov, fill it out, and attach it to DV-105." A rule on this page used to require that sentence. It went against the reason the tool exists.',
    by: 'sendsFilerForAForm in wording-rules.js (self-tested): compile-form.js refuses to write such a flowchart, and pipeline-audit.js RULE 20 fails the export and blocks the build. On the old build it found the one sentence' },

  { id: 'the-numbered-steps-grow-with-the-answers', group: 'interview', num: 'Rule',
    title: 'The numbered steps list only the forms the filer needs, and grow as answers bring more in',
    says: 'The numbered groups at the top start with the forms every filer fills - the form the packet opens with, the ones always included, and whatever those bring in unconditionally. A form an answer brings in is added to the numbered steps the moment the answer is given, in its place in the packet, with the steps after it renumbered and the new one marked for a moment; a form whose answer is taken back is taken off. The filer never sees a form they will not fill.',
    why: 'The bar was built with every form in the packet and hid the ones not needed only when the page moved to another section. A filer saw the whole list flash on a slow load, and after an answer brought in a form - pressing Fill maximum path switched on six - the bar still read "1 DV-100, 2 CLETS-001, 3 DV-110" until the filer moved on. The user asked for the opposite approach: show what is needed and add what is roped in.',
    by: 'generate.js builds the bar with only the forms needed at the start shown (getBuilderFormActivations: forms nothing targets, alwaysIncluded, and unconditional rules from those); updateProgressBar runs 150 ms after any change or keystroke and after a fill, numbering the steps shown 1, 2, 3; pipeline-nav-audit.js fails a bar that shows a form that is off, leaves out one that is on, or numbers them out of order - on a fresh page and after each fill' },

  { id: 'a-form-is-on-only-for-an-answer-in-a-form-that-is-on', group: 'packet', num: 'Rule',
    title: 'A form is in the packet only for an answer given in a form that is in the packet',
    says: 'A form an answer brings in is on only while that answer stands and the form it is asked in is itself on. An activation rule belongs to the form it names exactly - never to a form whose name merely starts the same.',
    why: 'DV-105 item 4a brings in DV-105(A). Its rule, matched on the start of the name, also switched on DV-105 and the second copy of DV-105(A), so the minimum path - which asks for no custody orders - walked twenty sections of custody forms instead of eleven. And a No left in a switched-off DV-105 kept DV-105(A) on, as it would for a filer who answered item 4a and then took back the custody request.',
    by: 'activationNamesForm and isFormActivatedAt in FormWiz GUI/generate.js; pipeline-nav-audit.js fails any form that is on with no exact rule to explain it - on the old build it named DV-105, DV-105(A) and DV-105(A) (2)' },

  { id: 'what-prints-fits-its-box', group: 'page', num: 'Rule',
    title: 'What goes on the paper fits its box',
    says: 'An answer longer than its box at the size the form declared is set smaller, down to 6pt, rather than cut at the edge. The parts of a joined box share its room, so together they fit, and a list the box cannot hold keeps the words that fit and ends with "etc.". An answer that does not fit even at 6pt fails the fill. Text is measured the way a viewer draws it - without kerning - and no line is drawn past the edge of its box.',
    why: 'Where several answers print in one box, nothing held them to its size: DV-100 item 4b ran each court case\'s number off the edge; CLETS-001 lost a license\'s state and an employer\'s address; DV-110 printed three of six firearms and cut the relationship mid-word. Every value was whole in its field, so every check that reads values passed. Later, CLETS-001’s firearms answer lost a letter at the right edge and DV-110’s firearms list ran 2pt past its box: the server measured with pdf-lib’s kerned widths, about 2% narrower than the unkerned text every viewer draws.',
    by: 'dev-server.js fitToBox (X-Fill-Shrunk, X-Fill-Unfitted headers), and a joined list that will not fit even at 6pt keeps its parts that do and ends "etc." (X-Fill-Listcut; the form names its lists with fwListSeparators); pipeline-fill.js fails on an answer that does not fit; generate.js applyFieldCapacities shares a joined box\'s room among the parts that have no box of their own, and applyComputedFields ends a long word list with "etc."; dev-server.js measureAsDrawn gives the fill’s font its drawn width; pipeline-fill.js fails any line an appearance stream draws past its box (--ink runs that check alone)' },

  { id: 'a-closing-question-closes-what-waits-on-it', group: 'interview', num: 'Rule',
    title: 'A question that closes closes everything waiting on it',
    says: 'When a changed answer closes a question, the question empties itself, and every question that waits on it looks again - and so on down the chain - so a filer who changes their mind never sees the questions their old answer opened, or files what they typed in them.',
    why: 'Changing DV-101\'s "Is there another incident?" to No closed and emptied the date of that incident, and the description after it stayed on screen holding what had been typed: it waits on the date, and hears the date only when the date itself changes. DV-105\'s custody order did the same. Every check filled the form forwards and never changed an answer back.',
    by: 'generate.js runs fwSettleVisibility a moment after any change a person makes (not during a fill); tested by changing gates back with real keys (Hand Off/AUDIT.md section 4)' },

  { id: 'a-follow-up-does-not-repeat-its-question', group: 'interview', num: 'Rule 19',
    title: 'A follow-up does not repeat the question it follows',
    says: 'A question an answer opens - most often the box behind "Something else" - says what it wants in its own words, and never reads the same as the question it waits on. "Where should the visits happen?" answered "Somewhere else" opens "Where else should the visits happen?".',
    why: 'DV-105 asked "Where should the visits happen?" and, on "Somewhere else", opened a box titled "Where should the visits happen?" - the same question twice in a row, the second wanting something the first never asked for. Five follow-ups did this. Every title was a full sentence, so every check passed; none compared a question with the one before it.',
    by: 'pipeline-audit.js RULE 19 (blocking): each question against every question it waits on, word for word' },

  { id: 'section-names-speak-to-the-filer', group: 'interview', num: 'Rule 17',
    title: 'A section name is a short label, and every title speaks to the filer',
    says: 'A section name names what the section is about in a few words - at most 32 characters and 5 words, with no colon and no prefix. No section name or question title says who else will read the answers ("For Law Enforcement", "for the court", "court use only", "what law enforcement needs to know about you"): every page the filer is shown is theirs to fill in, so it is headed and asked in their terms - "The Person to Restrain", "Your Information", "What are your identification details?".',
    why: 'CLETS-001 opened with "For Law Enforcement: The Person to Restrain" and "For Law Enforcement: You and Yours", and asked "What does law enforcement need to know about you?". The headings were long, and they read as though the page belonged to someone else - a filer could fairly think it was not theirs to answer. The form prints a line for its eventual reader; that line is not a heading for the person filling it in.',
    by: 'pipeline-audit.js RULE 17 (blocking); the section names live in each form’s hints, so a rename there survives a rebuild' },

  { id: 'a-form-brought-in-gets-its-data', group: 'packet', num: 'Rule 18',
    title: 'A form an answer brings in gets its data whenever that answer is given',
    says: 'When an answer switches a form on, every question on another form that fills its boxes is asked whenever that answer is given - not only after some other choice the filer may not make. DV-105 and DV-140 come in on "Child custody and visitation", so the children they list are asked after "We have a child or children together" OR "Child custody and visitation", after the orders question so both are known. A box that prints beside another answer - DV-100 item 3a’s names beside its "children together" box - is filled only while that box is ticked.',
    why: 'The children were asked only after "We have a child or children together". A filer asking for custody without ticking it - a guardian, say - was never asked for the children, and DV-140 item 3 printed ticked with no child named. Every check passed, because each question worked on its own; the gap was between the answer that brought the form in and the one that fed it.',
    by: 'pipeline-audit.js RULE 18 (blocking): for each form an answer brings in, walks each feeding question’s conditions from that answer (and the answers bringing in the form it is asked on), and tries a question under each answer of a question it depends on, so one reached down two branches that rejoin - DV-100’s firearms question - counts as asked. A blank that is the right answer is said by the form’s author: "blankWhenNotAsked": "<why>" on the field in its field config (a lawyer’s name, for a filer with no lawyer). Computed joinWhenTicked keeps a names line beside its box' },

  { id: 'disqualifiers-are-declared', group: 'interview', num: 'Rule',
    title: 'What disqualifies a filer is declared and wired',
    says: 'Every "you do not qualify unless" sentence on the paper form is written down in the disqualifiers file, and every declared one has an alert node behind it.',
    why: 'A rule written down and never wired up is worse than one nobody wrote down, because it looks handled.',
    by: 'dv-packet-disqualifiers.json; pipeline-build-packet.js wires them; pipeline-disqualifiers.js --check' },

  /* ---------------- the packet ---------------- */
  { id: 'the-packet-uses-mc025-for-more-space', group: 'packet', num: 'Rule 21',
    title: 'Anything that needs more space continues on MC-025',
    says: 'MC-025, Attachment, is the packet’s one continuation form. A narrative longer than its box and a table with more entries than the paper has rows both continue on MC-025 pages the packet fills itself: the SHORT TITLE (“Mora v. Smith”), the item continued in ATTACHMENT (Number) (“DV-100, Item 7(f)”), the text, and Page N of M across as many sheets as it takes. The case number is left for the clerk, as on every form. The forms the paper names for the same job - DV-101, MC-020 - are never used, and the pages attached are counted with the same layout that draws them. Substantive forms that hold more information (DV-105, DV-108, FL-150, DV-160) are forms of their own and are never replaced by it.',
    why: 'DV-100 item 7 continued onto DV-101 item 5, which held 387 characters more and then asked for a sheet of paper of the filer’s own; DV-160 held three answers to what their boxes printed and left its “not enough space” boxes blank by design; and every table’s extra rows went on a sheet drawn from scratch that no clerk would recognise as a Judicial Council form. California’s own instructions name MC-025 for all of it. With one form for every continuation, nothing the filer writes is capped or cut, every extra page looks the same, and DV-100 item 32 counts the sheets actually drawn - one per list was wrong the moment a list took two.',
    by: 'dv-packet.spec.json “continuation”; the overflow block’s “page” in each form’s hints and repeats[].attachment; FormWiz GUI/continuation-layout.js (the split, the lines and the page breaks - required by the drawer and embedded in every page); FormWiz GUI/attachment-page.js fills mc025.pdf (dv-field-configs/mc025-field-config.json); pipeline-fill.js draws and counts the pages; pipeline-audit.js RULE 21 fails an overflow that continues anywhere else, a missing MC-025 blank, or a replaced form left in the packet' },

  { id: 'every-box-can-be-ticked', group: 'page', num: 'Rule 22',
    title: 'Every box the filer can choose can be ticked',
    says: 'A checkbox field that holds several boxes told apart by export value is split, one field per box, so each can be ticked by its own name. The field config names each extra box with the field\'s id and "widget": "<export value>"; the sanitizer makes it a field of its own. A question whose answers are those boxes is a hint group with the boxes as its members, so each answer ticks its box and none is asked twice.',
    why: 'FL-155 is an older form: item 4\'s four tax statuses are one field, and so are item 8g\'s rent or mortgage and item 9\'s current or most recent job. pdf-lib ticks a field, not a box, so the paper could only ever say "single", "rent" and "my current employment" - whatever the filer chose. Asked as choices whose answers were copied onto the boxes, the housing and job boxes were also asked a second time, as "Do you have a 8g. Monthly housing costs: rent?".',
    by: 'auto-form/pdf-field-sanitizer.js splits "widget" entries; pipeline-audit.js RULE 22 fails any unsplit field on a filer\'s PDF (it named FL-155\'s four on the old build); pipeline-node-fields.js fails a node that marks a box it does not fill' },

  { id: 'overflow-brings-in-the-form', group: 'packet', num: 'Rule',
    title: 'Running out of space is what brings in the continuation',
    says: 'A form is never asked whether the filer needs more space. The box is measured, and past what it prints the “need more space” box is ticked and the remainder continues on an MC-025 page. Both ends of the link are dropped from the interview.',
    why: 'DV-100 item 7 ends with "Check this box if you need more space to describe the abuse. You can use form DV-101" — which asks someone to predict, before they have written a word, whether what they are about to say fits in a box whose size they cannot see. Nobody knows that. They need more space exactly when they have used more than the box holds, and the box has been measured.',
    by: 'the overflow block in the hints; compile-form.js drops both ends; applyOverflowLinks and overflowSplit in the generated runtime' },

  { id: 'no-box-asks-whether-it-will-be-needed', group: 'packet', num: 'Rule',
    title: 'No box on the packet asks whether it will be needed',
    says: 'Every "check here if you need more space" is driven by the writing or the count, never asked: it ticks the moment an answer outgrows its box or the entries outrun the rows. Past its box an answer has no limit - it continues on MC-025 for as many sheets as it takes. A box several answers share (DV-160 item 8, under both 8b and 8c) ticks while any of them runs over.',
    why: 'DV-101 item 5 carries the same escape DV-100 item 7 does, and removing one while leaving the other still asked a filer to predict whether what they were about to write would fit - one form further on. Each of the three states is knowable at the moment it happens: it fits, it fits across two boxes, or there is more of it than the packet can print. And the limit has to come off at the third, because stopping someone dead at the end of the second box is the form deciding how much of their account is worth having, when the paper itself offers them a sheet to carry on writing on.',
    by: 'the overflow declaration’s marks in each form’s hints (ticked by applyOverflowLinks, OR-ed across the answers that share it); an attachment’s marks for a table. A field driven from another form’s declaration must be named in that form’s overflowTargets, or it is compiled as a question' },

  { id: 'the-continuation-carries-the-remainder', group: 'packet', num: 'Rule',
    title: 'The continuation carries the remainder, not a copy',
    says: 'The first box keeps what it can print, ending on a whole word, and the MC-025 page takes the rest, so the two read as one passage. The filer meets no limit: the page takes another sheet.',
    why: 'The intent was once to put the whole answer on DV-101 so the attachment reads on its own, and the paper did not allow it: DV-100 item 7 holds 1115 characters and DV-101 item 5 held 387. Copying the whole answer would print a clipped one, and a court document that is unreadable at the bottom is worse than one that is split. Nothing is lost and nothing is cut.',
    by: 'overflowSplit() in FormWiz GUI/continuation-layout.js — one function for the live page, the payload that trims the box’s own answer, and pipeline-fill.js, because a split computed twice drops a word between the two pages or prints it on both' },

  { id: 'more-rows-go-on-an-attached-page', group: 'packet', num: 'Rule',
    title: 'More entries than the paper has rows go on MC-025',
    says: 'A “check here if you need more space” box under a table of rows is never asked. The block lets the filer keep adding entries past the rows the PDF prints; the extra ones are filled onto MC-025 pages headed the way the form instructs, and the box ticks itself whenever that page exists. The audit reads every PDF for these boxes and fails any that nothing ticks. One block can feed several pages: when several forms print the same entries, the block is asked once and its extra entries are drawn on each form’s own page — under that form’s heading, with that form’s columns, ticking that form’s box — and each page exists only while its form is in the packet.',
    why: 'DV-105 item 3 prints four rows for children and asked “Do you have more children to list on a separate page?” — but nothing let a fifth child be entered and no page was ever produced, while DV-100 item 32 counted one the moment the filer said yes. A parent of five had nowhere to name their fifth child, and a packet that claimed an attachment it never attached. Then the same gap on three forms at once: DV-100, DV-110 and CLETS-001 each print four other protected people with a “list more on a separate page” box, and CLETS-001 asked gender, race and date of birth on four screens of their own for people DV-100 had just named.',
    by: 'repeats[].attachment in the hints (fields: the columns this page prints; otherPages: the same entries on other forms’ pages), or “Extra entries on an attached page” on a Multiple Dropdown node; compile-form.js drops each box as a question, and a form whose box another form’s page ticks names it in attachmentTargets; the generated form ticks them and asks /edit_pdf to draw each page (FormWiz GUI/attachment-page.js); pipeline-fill.js draws them too; pipeline-audit.js RULE 13' },

  { id: 'a-condition-lives-in-the-style', group: 'packet', num: 'Rule',
    title: 'A connector’s condition lives in its style',
    says: 'Whatever decides a connector — the option chosen, or the field ticked — is written into the connector cell’s style string, beside connectorTarget.',
    why: 'The editor rebuilds a slot from the canvas, and a property set on the cell does not survive that round trip. Set as _activateWhenTicked the DV-101 rule exported as unconditional: true, which reads as "always file DV-101" — the same class of loss already fixed once for flowchart-level keys. Anything that must survive a rebuild has to live somewhere the rebuild reads.',
    by: 'pipeline-build-packet.js writes it; connector-nodes.js reads either' },

  { id: 'no-connector-is-left-loose', group: 'packet', num: 'Rule',
    title: 'No connector is left loose: each hangs off what decides it, and the always-on ones hang under End, most important first',
    says: 'A connector that an answer decides hangs off that answer. One that waits on a box the writing ticks — DV-101, when item 7f outgrows its space — hangs beside the question whose answer ticks it, with its condition written under it. Every connector that nothing decides is a child of the form’s central End node, chained one below the other: End, then the most important form, then the next, down to the least important at the bottom, in the order of the spec’s activates. Only an answer is a condition: End, a connector above in the chain, or a question a connector hangs beside are places. Double-clicking a connector shows all of this and lets it be edited.',
    why: 'They were dropped under the lowest node and wired to nothing, so every chart ended in boxes floating below it — a loose end, which the flowchart rules forbid everywhere else, and no way to see at a glance which forms follow this one or in what order. Chaining them under End says what they mean: finish this form and these come next. The reader that turns connectors into activation rules had to learn the same thing, or it read End as an answer labelled "END" that no filer can choose, and DV-109, DV-110 and CLETS-001 would never have been asked.',
    by: 'pipeline-build-packet.js (endNodeOf, overflowQuestionFor, the chain in main); connector-nodes.js collectProjectConnectors takes only an option as a condition, and showConnectorProperties is the double-click menu' },

  { id: 'which-forms-are-in-the-packet', group: 'packet', num: 'Rule',
    title: 'One place says which forms are in the packet',
    says: 'Every script that walks the packet asks packet-forms.js, which reads dv-packet.spec.json. No script keeps its own list.',
    why: 'Four of them did, and every one went stale silently. pipeline-fill.js had three of five written out, so DV-101 and DV-105 were switched on by a run and never filled or rendered. pipeline-connect.js had five of six and skipped DV-108’s names entirely. pipeline-sanitize.js rebuilt three of six by default, so a field-config edit to either of the others was not live in the PDF being filled. pipeline-capacity.js matched filenames against /^dv\d+\.pdf$/, which is not a list at all until a form is called CLETS-001. In each case the run looked exactly like a clean one with fewer pages.',
    by: 'packet-forms.js — packetForms(), from the spec' },

  { id: 'an-order-is-the-courts-except-its-identifying-items', group: 'packet', num: 'Rule',
    title: 'A court order is the court’s, except the items that identify the case',
    says: 'On a form that says This is a Court Order, the filer completes only the identifying items and the proposed orders their own request already asks for; every other field - findings, rulings, enforcement, the signature - is marked courtUse. Those items carry the names of the questions that already ask them, so the form is filled from what the packet knows and asks nothing new.',
    why: 'DV-140 is 221 fields and 195 of them are the judge’s. Of the 25 that are not, every one - the two names, the two relationships to the children, the children themselves - is a question DV-100 or DV-105 already asks. Given DV-105’s names it asks nothing at all, which is right: a filer should not answer the same question twice because two forms print it. DV-145, the proposed Order to Prevent Child Abduction, prints the orders DV-108 requests (items 4-10): under DV-108’s names it too asks nothing, and the judge’s findings, enforcement and other orders stay the court’s.',
    by: 'dv140-field-config.json, dv145-field-config.json; the same split DV-110, DV-109 and DV-165 use' },

  { id: 'attached-to-is-not-switched-on-by', group: 'packet', num: 'Rule',
    title: 'What a form is attached to is not what switches it on',
    says: 'Each attachment declares attachedTo in the spec, copied from its own first line - "This form is attached to ...". A count of attached pages follows that chain to the form it is for, so an attachment’s attachment counts and a form attached elsewhere does not.',
    why: 'DV-100 item 32 counted every form switched on by an answer as attached to DV-100. That held while DV-101 and DV-105 were the only such forms. DV-140 is switched on by DV-100’s custody box and printed as attached to DV-110, so its six pages went into item 32, which read 18 where the stack handed in with DV-100 is 12 - on a line the filer signs under penalty of perjury. DV-108 is attached to DV-105, which is attached to DV-100, so its two pages rightly do count.',
    by: 'attachedTo in dv-packet.spec.json, carried in defaultPdfProperties like pdfPages; pagesOfFormsAttachedTo in the computed rule; the chain walk in applyComputedFields' },

  { id: 'court-use', group: 'packet', num: 'Rule 6',
    title: 'Ask only what the filer completes',
    says: 'Every Judicial Council form prints who completes what. A field marked courtUse never becomes a question and stays blank for the judge or clerk.',
    why: 'Asking a survivor what the judge decided produces an answer they cannot know and a filed order that says the court ruled something it has not. This took the packet from 358 questions to about 145.',
    by: 'courtUse in the field config; pipeline-audit.js counts them separately' },

  { id: 'court-field-not-filer-name', group: 'packet', num: 'Rule',
    title: 'A court field must not share a filer’s name',
    says: 'A courtUse field may not carry a name that a filer field somewhere in the packet also carries. Where it does, the court’s copy is renamed with its own form in front.',
    why: 'DV-110 item 6 is a court finding, and its firearm field was called firearm_item_1_description — the same as the DV-100 box where the filer lists what they believe. The filer’s claim was posted straight into the judge’s finding. Nine fields.',
    by: 'pipeline-connect.js — exits non-zero from --check while any remain' },

  { id: 'shared-name-is-the-wiring', group: 'packet', num: 'Rule',
    title: 'A shared field name is the wiring',
    says: 'One answer fills every form that prints it, by giving those fields the same canonical name. The connections file records which are the same answer.',
    why: 'Without it the interview asks three times and a survivor retypes their abuser’s name on every form.',
    by: 'dv-packet-connections.json; pipeline-connect.js' },

  { id: 'one-group-per-form', group: 'packet', num: 'Rule 5',
    title: 'One group per form, named after the form',
    says: 'Exactly one group per form, named after it, holding the sections that carry a question.',
    why: 'The progress bar counts forms rather than sections.',
    by: 'pipeline-audit.js — RULE 5' },

  { id: 'silent-form-still-ships', group: 'packet', num: 'Rule 7',
    title: 'A form that asks nothing still ships',
    says: 'DV-109 asks the filer nothing of its own, and its PDF must still be produced and offered.',
    why: 'A form with no questions is easy to drop from the output and nobody sees it missing until filing.',
    by: 'pipeline-audit.js — RULE 7' },

  { id: 'sections-follow-the-filer', group: 'packet', num: 'Rule',
    title: 'Sections switch in the order the filer meets them',
    says: 'Section assignment walks every question in interview order, branches included, so a section may open inside a branch.',
    why: 'Assignment used to run along the spine and hand each branch its parent’s section, which emptied "Animals, Property and Support" the moment items 16 to 28 moved under the orders question.',
    by: 'compile-form.js — assignSections; the packet build reports any section dropped for being empty' },

  { id: 'the-preview-marks-what-a-node-fills', group: 'process', num: 'Rule',
    title: 'Selecting a node marks every box it fills on the paper, and nothing else',
    says: 'The editor’s PDF preview names a node’s fields the way the generated form posts them: its own id, its mirrors, each box of a combined question (named in full or after the question), each entry of a numbered block, each option of a choice - through the split hub - and every joined box its answer is printed in. The rule lives in node-field-names.js, which the preview and the check both load.',
    why: 'The preview said in red that 152 of the packet’s 288 questions matched no field, when every one was wired: checkbox and dropdown questions whose boxes are their options, combined questions whose boxes are named after the question, numbered blocks, and answers printed inside a joined box such as court_name_and_street_address. That red message is the one thing the preview is trusted to say. It had been tried only on questions that fill one box named after themselves.',
    by: 'pipeline-node-fields.js (npm run audit): every question node of every form against what dv-packet-gui.json posts onto that form’s PDF, joins included - fails on a node shown red, on one marked only in part, and on one marking a box it does not fill' },

  { id: 'survive-a-rebuild', group: 'packet', num: 'Rule',
    title: 'Anything that must survive a rebuild lives in a source the rebuild reads',
    says: 'If a build regenerates an artifact, nothing hand-added to that artifact survives. Put it in an input.',
    why: 'The first four disqualifier alerts were drawn by hand into the built project. The next rebuild dropped all four and the packet went out with the rules declared and none of them wired — the exact failure the disqualifiers file exists to prevent.',
    by: 'pipeline-build-packet.js wires them from the declaration each time' },

  { id: 'every-form-opens-with-its-name', group: 'packet', num: 'Rule',
    title: 'Every form’s flowchart opens with its name',
    says: 'Each form in the project has one notes node above everything else in its chart, reading "<form> Form" - bold, font 50, 1580 × 350, 150 above the first node, text centred both ways. The builder adds it last, and a rebuild replaces it rather than stacking a second.',
    why: 'A packet is several charts in one editor, each tens of thousands of pixels tall and built from the same shapes. Zoomed out, DV-140’s chart is DV-105’s first twenty nodes in the same order, and nothing on the canvas said which was open. DV-100 was given one by hand; a convention only one form follows is one the next form breaks.',
    by: 'pipeline-build-packet.js adds it and pipeline-audit-flowchart.js check 9 fails a form without it - both from title-note.js, so they agree on what it is' },

  { id: 'a-project-carries-its-name', group: 'packet', num: 'Rule',
    title: 'A project file carries its name',
    says: 'Every project JSON has a projectName. The builder writes the spec’s "project"; the editor exports whatever the Project Name box holds, and fills that box from the file on import - with nothing, if the file has no name.',
    why: 'The builder always wrote "DV Restraining Order Packet". The editor dropped it on the first export and never read it on import, so one trip through the editor made the file anonymous, and importing another project left the last one’s name in the box.',
    by: 'pipeline-audit-flowchart.js - fails a project with no name' },

  /* ---------------- the printed page ---------------- */
  { id: 'fill-and-read-back', group: 'page', num: 'Rule 4',
    title: 'Fill the packet and read the PDFs back',
    says: 'Post a captured answer set exactly as the form does, keep the filled PDFs, and check every field the answers reached carries a value. A blank is allowed only when an answer ruled it out, and that has to be shown.',
    why: 'A field whose question exists, whose gates are all open, and which is still empty is a defect, not a branch.',
    by: 'pipeline-fill.js and pipeline-explain.js — DEFECT count must be zero' },

  { id: 'look-at-every-page', group: 'page', num: 'Rule',
    title: 'Look at every page as an image',
    says: 'Render every page of every filled PDF and read the images against the blank form. Not optional, and last.',
    why: 'Every other check reads data. A field can hold exactly the right string and still print in the wrong place — the value lives in the field dictionary and the ink comes from the appearance stream. DV-101 printing an answer through the words "Describe any injuries:" passed every data-level check.',
    by: 'pipeline-fill.js --render, then a page-by-page read' },

  { id: 'every-blank-box-is-accounted-for', group: 'page', num: 'Rule',
    title: 'Every blank checkbox is either the court’s or an option not chosen',
    says: 'The fill reports each form’s checkbox count broken down: how many the court ticks, and how many are an option the run did not choose. A box the court owns that comes back ticked is reported as a defect.',
    why: 'DV-110 comes back with three of eighty-five ticked, which reads as a form that barely filled and is in fact correct - eighty are the judge’s decisions and the other two are the gender options not chosen. A ratio that has to be re-derived by hand every time it is read will eventually be read as a defect, or worse, a real one will be read as this.',
    by: 'pipeline-fill.js — courtOwnedBoxes(), from the courtUse marks in dv-field-configs/' },

  { id: 'publish-the-pages', group: 'page', num: 'Rule',
    title: 'Publish the pages you looked at',
    says: 'Every full pass ends by copying the exact images the audit read into Current Form Output/, one folder per form. The folder is replaced, never merged.',
    why: 'Describing what you saw asks the reader to take your word for it. A leftover page from an older run is worse than no page, because it looks current and is not.',
    by: 'pipeline-current-output.js; form-output-dashboard.html watches the folder' },

  { id: 'know-what-a-box-holds', group: 'page', num: 'Rule',
    title: 'Know what a box holds, and stop there',
    says: 'Every PDF box is measured and the interview is given the limit, as a maxlength on the input. A box with continuation lines is measured across the whole chain.',
    why: 'All 465 text fields declare a fixed font size, so a value wider than its box is drawn and then clipped — the answer is on the page and unreadable, and nothing upstream knows, because the DOM and the payload both have the whole string. A filer stopped at the point of typing can shorten what they meant to say; one truncated afterwards cannot.',
    by: 'pipeline-capacity.js measures; the maximum path fills every measured box to exactly its capacity so the rendered page shows whether it stops cleanly' },

  { id: 'measure-with-the-thing-that-draws', group: 'page', num: 'Rule',
    title: 'Measure a box with the code that draws it',
    says: 'A capacity is found by laying the text out with pdf-lib’s own layoutMultilineText and bisecting for the longest run that stays inside the box — over the lines the form actually ruled, using the exact string the fill will write, marker included.',
    why: 'Four separate attempts to predict that layout were each wrong by about a line, and a line is the whole answer: width ÷ average character ignores that words do not split, so DV-101 item 5 measured 400 and printed about 350; a wrap written by hand fitted 98 characters to a line of DV-100 item 14 where pdf-lib fitted 94; box height ÷ font line height gave DV-101 item 4c nineteen lines against seventeen rules; and a plain prefix of the sample is not the string that gets written, because [end] replaces the last five characters and lengthens the closing word. Close is no use — the point of the number is that the text stops inside the box.',
    by: 'pipeline-capacity.js — charsThatLayOut and fillOfLength; verified by filling every wrapping box to capacity and finding none over and none under' },

  { id: 'fill-with-the-text-that-was-measured', group: 'page', num: 'Rule',
    title: 'Fill with the text the capacity was measured from',
    says: 'pipeline-capacity.js and fillToLength() in the generated runtime share one filler text verbatim, and a box that wraps is filled with it from its first word rather than from a per-field sample value.',
    why: 'A capacity is a promise about some particular text, because these are proportional fonts and no count is right for every string. In a box that wraps, the words before the padding decide where every later line breaks — so measuring against one sample and filling with another gives up the only guarantee the number can offer, and even one leading space moves every break after it. Whether a box wraps is what the measurement says, not what the control looks like: dv101_abuse_1_witnesses is a plain input on the page and two ruled lines on the paper.',
    by: 'the shared FILLER text; the __wraps map inside fieldCapacity, which rides along with the measurement rather than being threaded through five files' },

  { id: 'short-form-when-the-long-one-will-not-fit', group: 'page', num: 'Rule',
    title: 'Where the long form will not fit, the short form goes on the paper',
    says: 'When a measured box cannot hold the answer and the form already keeps a canonical short form of that same answer, the short form is what the PDF gets. An answer that fits is never shortened.',
    why: 'DV-110’s State box holds four characters - it is printed for a postal code - while the question is a dropdown of full state names, because picking California is easier and less error-prone than typing two letters. Neither end is wrong; they just disagree, and the disagreement was being resolved by clipping Wyoming to Wyor on a field the form stars as required for a police database.',
    by: 'shorterFormThatFits() in pdfValueForNamedField, reading the hidden <field>_short the state select already maintains' },

  { id: 'a-derived-mirror-is-not-an-answer', group: 'page', num: 'Rule',
    title: 'A box another control writes is not a question',
    says: 'The debug fill skips fields hidden by an inline style on themselves - the _short, _hidden, _code and _no_code mirrors a dropdown or a phone widget maintains - and refreshes them from their owners after the fill instead.',
    why: 'The fill was writing Test Value over every one of them, so the short form of a state was test text. A question hidden because of an answer is hidden by a class on its container, which the fill already checks; a box hidden on itself was put there by the form for its own use. And a fill sets a select without its inline onchange ever running, so the mirrors need recomputing afterwards the way every other derived field does.',
    by: 'isDerivedMirror() and refreshStateMirrors() in the generated runtime' },

  { id: 'a-rule-is-matched-to-the-run-not-the-last-rule', group: 'page', num: 'Rule',
    title: 'A ruled line is matched to the run, not to the rule above it',
    says: 'The writing lines of a box are the longest run of rules that fit an even progression from one of them, within a quarter of the pitch. Not the longest run of consecutive gaps that match the median.',
    why: 'A form’s rules are evenly spaced to the eye and not to the point: DV-100 item 17b is ruled at 14.1, 11.4 and 13.5, which is one block of four lines and reads as one. Comparing each gap to the median broke the run at the 11.4 and kept two, so a box that holds about 380 characters was measured at 190 and half of it went unused. Comparing each rule to where the run says it should be lets that jitter accumulate and cancel, which is what jitter does.',
    by: 'ruled-lines.js — evenlySpacedRun(); every start is tried, because the first rule inside a widget is not always one of its writing lines' },

  { id: 'a-shape-is-a-shape-in-both-places', group: 'page', num: 'Rule',
    title: 'A field with a shape is known to be one in both places',
    says: 'getSampleFillValue() and hasValidatedShape() agree about which fields have a shape. A field the first gives a shaped value to is a field the second refuses to pad.',
    why: 'They had drifted: the sampler produced 123-45-6789 for a Social Security number and the shape test had never heard of one, so the first SSN box in the packet - CLETS-001 item 1 - printed 123-45[end]. A padded SSN is not a longer SSN, it is a wrong one, on a form that goes into a police database. The pair exist to ask the same question, so they have to answer it the same way.',
    by: 'hasValidatedShape() in the generated runtime, which now knows ssn, social and ein' },

  { id: 'a-narrow-box-still-gets-a-limit', group: 'page', num: 'Rule',
    title: 'A box too narrow for a word still gets a limit',
    says: 'When no whole word fits on a line, the line is measured in characters instead. No text box is left unmeasured.',
    why: 'Fitting whole words returned zero for DV-110’s State box, zero was read as "not measured", and the field was left with no cap at all — so Wyoming printed as Wyor with nothing to say so. The narrowest box is the one that most needs the limit.',
    by: 'pipeline-capacity.js — charsThatFit; the State box holds four characters, which is a fact about the paper that the dropdown of full state names still has to answer' },

  { id: 'validated-shapes-are-not-padded', group: 'page', num: 'Rule',
    title: 'A field whose content has a shape is never padded',
    says: 'A ZIP, a date, a phone, a percentage or an age is filled with a real value of that shape and neither capped-to-fill nor marker-filled.',
    why: 'A ZIP padded to eleven characters is not a longer ZIP, it is a wrong one, and the page would be testing the wrong thing. Both the marker fill and the capacity padding ask the same question, so the test lives once and they cannot drift.',
    by: 'hasValidatedShape() in the generated runtime, used by getSampleFillValue and padToCapacity' },

  { id: 'text-sits-on-the-ruled-lines', group: 'page', num: 'Rule',
    title: 'Multi-line text is laid on the lines the form ruled',
    says: 'The rules are read out of the page’s content stream and each baseline is put 1.6pt above one of them. Only the evenly spaced run of rules inside a box counts, and a rule on the box’s bottom edge counts.',
    why: 'Dividing the box height by the lines it holds is close, and close compounds: DV-101 item 5 is 60.4pt over four lines, which gives 15.1pt against a real 14.0, so the first line cleared its rule and the fourth was struck through. The two filters are earned as well — a widget’s rectangle is not drawn to the ruled area, so DV-101 item 3d covered the label rule of item 3e below it and printed one sentence over another, and DV-105 item 5b is drawn so its last rule is the box’s bottom edge, which a one-point margin threw away.',
    by: 'ruled-lines.js parses the content stream; dev-server.js harvests once per fill and lays the baselines. Where the rules cannot be read the old estimate still runs' },

  { id: 'a-line-with-nowhere-to-go-says-so', group: 'page', num: 'Rule',
    title: 'A line that will not print says so',
    says: 'When a value lays out into more lines than the box has rules, the fill logs the field, the lines it needs and the lines it has. A clean run logs none.',
    why: 'Text laid out past the last rule is written below the box and clipped. The value is complete in the AcroForm, the payload is complete, and only the ink is short — so every check that reads data passes and the paper is wrong. Whoever is filling the packet deserves to be told which box it was.',
    by: 'dev-server.js — ruledPitchAppearance; six boxes were dropping a line before the measurement was fixed, and none are now' },

  { id: 'long-answer-next-line', group: 'page', num: 'Rule',
    title: 'A long answer runs onto the next ruled line',
    says: 'When an answer is wider than its line, the remainder wraps onto the ruled lines beneath it. The continuation is found by geometry, not by field names.',
    why: 'DV-100 item 16b(3) has 166pt of line and the answer wanted 226pt, so it was drawn and clipped while the second ruled line the form printed for exactly this sat empty. Later FL-155 item 3c, whose two boxes overlap (lines 8.8pt apart, boxes 15.8pt tall): the test for "the line beneath" looked for a box starting below the first one ended, found none, and the answer ran 84pt off the edge.',
    by: 'dev-server.js — spillOntoContinuationLines, which logs every spill; the next line is found bottom to bottom, one line pitch down, so overlapping boxes chain too' },

  { id: 'box-must-not-cover-its-label', group: 'page', num: 'Rule',
    title: 'A field box must not cover the form’s own label',
    says: 'A multi-line field whose rectangle covers text the page already printed has its top lowered when the PDF is sanitized.',
    why: 'DV-101 item 3e starts eight points above the label it belongs to, so the answer printed straight through the words "Describe any injuries:". Only the page image finds it.',
    by: 'pipeline-sanitize.js — reports every box it lowers' },

  { id: 'buttons-keep-their-words', group: 'page', num: 'Rule',
    title: 'A button that was printing words keeps them',
    says: 'A push button with no background colour is text the page needs; its caption is drawn as ink before the widget is dropped. One with a background colour is a control and goes.',
    why: 'DV-100 page 13 lists the forms you must file, and each form number was a push button. Deleting them printed "Form , Temporary Restraining Order" — a survivor told to file a form the page no longer names.',
    by: 'pipeline-sanitize.js — reports every caption it draws' },

  { id: 'one-line-box-is-one-line', group: 'page', num: 'Rule',
    title: 'A box one line tall is laid out as one line',
    says: 'A field carrying the multiline flag in a box shorter than one line of multiline text borrows the single-line layout, which fits.',
    why: 'pdf-lib needs 12.21pt at 11pt Helvetica, the box gives 12.00pt, and the glyphs are clipped through the middle.',
    by: 'dev-server.js — ruledLineTextAppearance' },

  /* ---------------- working on it ---------------- */
  { id: 'the-paper-is-on-screen', group: 'process',
    title: 'The paper is on screen beside the flowchart',
    says: 'The Default PDF Properties panel renders the form it names, page by page, with a View Fullscreen button that lays every page out one under the next to scroll through, opening on the page that was showing. Selecting a node lights up the box on the paper that node fills, jumping to the page that box is on and naming the field in full.',
    why: 'A question in the editor is a rectangle with a name on it, and the thing that name refers to is a box on a court form the author cannot see. Whether this is the question that prints in item 7, whether the box is a line or a paragraph, whether two questions point at the same box - all of it was knowable only by opening the PDF separately and hunting for the field by eye. A name that matches nothing on the PDF says so in red, which is the cheapest possible check that a node is wired to something real.',
    by: 'pdf-preview.js — rendered to a canvas, not an iframe, because the highlight needs the widget rectangles drawn over the page' },

  { id: 'no-redraw-can-cause-its-own-redraw', group: 'process',
    title: 'Nothing that resizes may be watched for resizing',
    says: 'The preview measures its width from the panel around it and redraws on window resize, never on a ResizeObserver watching the box the canvas is in.',
    why: 'The canvas is what makes the box tall enough to need a scrollbar, and the scrollbar is what makes the box narrower - so a redraw sized to the box changed the width the next redraw would use. It ran forever and took the editor’s main thread with it. A redraw that can be caused by its own last redraw is a loop looking for somewhere to happen.',
    by: 'pdf-preview.js — fitWidth() reads the panel; the window is the only thing here whose size is not an effect of the drawing' },

  { id: 'nothing-renders-to-a-hidden-tab', group: 'process',
    title: 'Nothing renders to a tab nobody is looking at',
    says: 'The preview defers drawing while document.hidden, and draws what it deferred on visibilitychange. The highlight is still positioned, because the viewport is computed before the render.',
    why: 'pdf.js drives a canvas render from requestAnimationFrame, and a hidden tab is served no frames - so the render starts, paints part of the page, and never finishes or settles its promise. Left to run, that is a task that never clears and a preview stuck half-drawn from the moment the editor is opened in a background tab.',
    by: 'pdf-preview.js — the document.hidden check in draw(), and the visibilitychange listener' },

  { id: 'read-the-interview', group: 'process', num: 'Rule',
    title: 'Read the whole interview before shipping',
    says: 'Print the interview in the order a person meets it, read all of it, then answer the form in the preview and check that saying No to a gate really does remove the block behind it.',
    why: 'The audit is a regression test for defects that already happened once. It reported zero failures on a packet that asked thirty questions about further abuse of a filer who had just said it happened once.',
    by: 'pipeline-review.js — required, not a review of last resort' },

  { id: 'wait-for-the-builder', group: 'process', num: 'Rule',
    title: 'Wait for the builder before reading it back',
    says: 'loadFormData restores hidden logic on per-question timers. Give it time and check the count before calling getFormHTML.',
    why: 'Read too early and the page is emitted with no hidden logic, so every exclusive choice falls back to a label-derived checkbox name that matches no PDF field. The interview looks right, the payload looks full, the audit passes, and the printed boxes are empty — fifteen groups on DV-100 alone.',
    by: 'count .hidden-logic-config in the builder, and grep the emitted HTML for a non-empty hiddenLogicConfigs' },

  { id: 'restart-the-server-in-place', group: 'process', num: 'Rule',
    title: 'Restart the dev server in place',
    says: 'When dev-server.js changes, kill the process on 8080 and start it again on 8080. Never a second port.',
    why: 'A second port means the browser tab, the preview and every pipeline default keep talking to the stale server, so what you see is not what just changed.',
    by: 'convention' },

  { id: 'prefer-geometry', group: 'process', num: 'Rule',
    title: 'Prefer geometry to names',
    says: 'Where a PDF’s own names carry no meaning, decide from the rectangles: which label belongs to which box, which line continues which, which button is a control.',
    why: 'Judicial Council field names are laid down by the authoring tool. Guessing which "tf" is Start is how a form prints the end time in the start column, and nothing downstream catches it.',
    by: 'pipeline-field-labels.js and the geometry tests in the sanitizer and filler' },

  { id: 'no-hard-coding', group: 'process', num: 'Rule',
    title: 'Every rule is general, never written for one form',
    says: 'New behaviour is driven by declarations and by what can be measured, not by a list of field names for the form in front of you.',
    why: 'The packet is going to keep growing. A fix that names DV-100 fields is a fix that has to be written again for the next form.',
    by: 'review; every rule here states the signal it keys on' },
];
